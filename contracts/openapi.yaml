  /api/v1/automation/publishers:
    get:
      tags: [automation]
      operationId: findPublishers
      summary: Publishers — API keys, domain scope, quota, and rejection history
      description: |
        **Owned by `modules/automation.md` §5a.1** — the section this contract is generated from.

        `design/screens/automation.md` §8 · `modules/automation.md` §8, §7.11.

        **RBAC: `automation:publisher:read : *` and `automation:publisher:write : *` — a separate,
        global RBAC resource** (`ARCHITECTURE.md` §11), *"granted separately from access to Signals
        because it decides who may inject events."* Holding it is equivalent to holding production
        credentials, and the screen carries the key icon that marks exactly three resources in the
        whole product.

        **Default: all publishers, `code` ascending** — deliberately *not* filtered to `active`,
        because *"hiding inactive publishers would hide the ones most likely to be a problem."*
        **Polled 60s** — `last_used_at` and the rejection counters are what a person watches
        immediately after rotating a key.

        Columns: `publishers.code`, `.name`, `.allowed_domains`, `.active`, `.last_used_at`, plus
        `count(ingested_events WHERE publisher_id = …)` and the counted rejection queues
        (`401 unknown or revoked key`, `403 domain out of scope`, both over 7 days).

        **Adopted, on a second DI token** (`modules/automation.md` §5a.3). The four publisher operations go on
        **`AutomationPublisherClient`**, not on `AutomationClient`:

        ```ts
        // AutomationPublisherClient
        abstract findPublishers(...): ...;
        abstract createPublisher(...): ...;
        abstract rotateKey(...): ...;
        abstract revokeKey(...): ...;
        ```

        **Why a second token.** §11 makes `automation:publisher` one of three globally-granted resources
        *"because it decides who may inject events"*, and `POST /publishers` is the only response in this
        contract carrying a plaintext secret. *"A key-minting method on the token every module can inject puts
        that secret behind code paths RBAC never sees."* `directory` already solved this exact shape by
        exporting `DirectoryProjectionClient` beside `DirectoryClient` from one module.
      parameters:
        - name: window
          in: query
          schema:
            type: string
            default: 7d
          description: |
            `?window=7d` — written into the path in the source as
            `GET /api/v1/automation/publishers?window=7d`. **7 days is also the blast-radius window
            a key revocation must state** (`design/patterns.md` §6, DD-08): *"4,182 events in the
            last 7 days"*, not *"this may affect other systems"*.
      responses:
        '200':
          description: ⚠️ **Response shape UNSPECIFIED** beyond the column list above.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [automation]
      operationId: createPublisher
      summary: Create a publisher and mint its API key
      description: |
        **Owned by `modules/automation.md` §5a.1** — the section this contract is generated from.

        `design/screens/automation.md` §8. **RBAC: `automation:publisher:write : *`** — global.

        **The key is returned exactly once, at creation, and is never readable afterwards** — only
        `api_key_hash` is stored. This is the only response in the contract that carries a secret,
        and the screen renders it in a one-time panel.

        **Adopted, on a second DI token — `AutomationPublisherClient.createPublisher`**
        (`modules/automation.md` §5a.3), never on `AutomationClient`. This is the only response in the whole
        contract that carries a plaintext secret, and §11 grants `automation:publisher` globally *"because it
        decides who may inject events."*
      requestBody:
        required: true
        description: |
          ⚠️ **Request body UNSPECIFIED.** Inferable from the table columns (`code`, `name`,
          `allowed_domains[]`, `active`, plus the rate limit / quota / envelope ceiling that §7.11
          puts on the row) but never stated as a body anywhere.
        content:
          application/json:
            schema: {}
      responses:
        '201':
          description: |
            ⚠️ **Response shape UNSPECIFIED as fields.** What *is* specified: it carries the plaintext
            API key, once. No field name is given for it.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/automation/publishers/{id}/rotate:
    post:
      tags: [automation]
      operationId: rotatePublisherKey
      summary: Rotate a publisher's API key
      description: |
        **Owned by `modules/automation.md` §5a.1** — the section this contract is generated from.

        `design/screens/automation.md` §8. **RBAC: `automation:publisher:write : *`** — global.

        **The old key stops working immediately.** The confirmation must state the measured blast
        radius — the publisher's event volume over 7 days — and that **payloads are not stored on
        rejection**, so nothing is recoverable from the requests that will now fail `401`
        (`design/patterns.md` §6).

        **Adopted, on a second DI token — `AutomationPublisherClient.rotateKey`**
        (`modules/automation.md` §5a.3), for the same reason as `createPublisher`: it mints the credential the
        ingress door authenticates against.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        description: ⚠️ **Request body UNSPECIFIED.**
        content:
          application/json:
            schema: {}
      responses:
        '200':
          description: |
            ⚠️ **Response shape UNSPECIFIED as fields.** Carries the new key once; no field name given.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/automation/publishers/{id}/revoke:
    post:
      tags: [automation]
      operationId: revokePublisherKey
      summary: Revoke a publisher's API key
      description: |
        **Owned by `modules/automation.md` §5a.1** — the section this contract is generated from.

        `design/screens/automation.md` §8. **RBAC: `automation:publisher:revoke : *`** — a distinct
        action from `write`, and global.

        Sets `.active = false`. Same 7-day blast-radius statement as rotation.

        **Adopted, on a second DI token — `AutomationPublisherClient.revokeKey`**
        (`modules/automation.md` §5a.3).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        description: ⚠️ **Request body UNSPECIFIED.**
        content:
          application/json:
            schema: {}
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/automation/streams:
    get:
      tags: [automation]
      operationId: findStreamSubscriptions
      summary: Stream subscriptions and consumer-group health
      description: |
        **Owned by `modules/automation.md` §5a.1** — the section this contract is generated from.

        `design/screens/automation.md` §9 · `modules/automation.md` §7.12, §8.

        **RBAC: `automation:stream_subscription:write : *`.**

        **Polled 10s** — *"`last_id` and pending answer 'is the consumer alive?', and that answer is
        worthless at a minute's age."* No filters; the table is four rows.

        Lag is reported **in time, not entries**: *"ten thousand entries means nothing without a
        rate; 'four minutes behind' means something to everyone"* (§7.12). Pending-entry age is
        alerted **separately** from lag, because zero lag with an hour-old pending entry is a stuck
        consumer that looks perfectly healthy on a lag graph.

        Columns: `stream_subscriptions.stream_key`, `.consumer_group`, `.active`, `.last_id`,
        `.created_at`.

        ⚠️ **No write endpoint exists.** `Add subscription`, `Activate / deactivate` and `Delete`
        carry RBAC and no path.
      parameters:
        - name: includePending
          in: query
          schema:
            type: boolean
          description: |
            `?includePending=true` — the live `XPENDING` count. ⚠️ The source flags this itself:
            **`pending` has no column in `stream_subscriptions`. It is a live Redis read, not stored
            state, and no endpoint for it is specified** — this parameter is the design's assumption
            about how the value arrives.
      responses:
        '200':
          description: ⚠️ **Response shape UNSPECIFIED** beyond the column list above.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/automation/simulate:
    post:
      tags: [automation]
      operationId: simulateEvent
      summary: Publish a real envelope to the real stream
      description: |
        **Owned by `modules/automation.md` §5a.1** — the section this contract is generated from.

        `design/screens/automation.md` §10 · `modules/automation.md` §8.

        **RBAC: `automation:event:publish : domain:<d>`.**

        **This is not a REST shortcut.** The server performs `XADD <domain>:events` and the envelope
        then takes the ordinary consumer path — *"a simulator that takes a different path tests a
        path that does not exist in production."* The result row is followed live from `planned` to
        a terminal status via `GET /api/v1/automation/events/{id}`.

        `eventId` is editable on the form, *"so this is reachable on purpose"* — i.e. deliberately
        re-publishing an id to observe the `duplicate` branch is a supported use.

        Note this door is the **stream** door, so `event_types.http_ingress` is irrelevant here; what
        *is* checked is `subject_types.ref_format`, so a ref that would be rejected as `invalid` is
        caught in the simulator rather than in the ingest history.

        **Adopted — this operation has no client method** (`modules/automation.md` §5a.3). `AutomationClient`
        must gain:

        ```ts
        abstract simulate(cmd: SimulateEventCommand): Promise<IngestAck>;
        ```

        This `XADD`s to the **real** stream, so it must be the same path production takes — and *"a named
        method on the contract is what makes 'identical path' checkable; a controller body is not."*
      requestBody:
        required: true
        description: |
          ⚠️ **Request body UNSPECIFIED as fields.** The form carries an event type, a subject `type`
          and `ref`, a `data` JSON block, and an editable `eventId`. Whether the wire shape is a
          §7.2 envelope or a wrapper around one is not stated.
        content:
          application/json:
            schema: {}
      responses:
        '202':
          description: |
            ⚠️ **Response shape UNSPECIFIED as fields.** The screen renders the target stream
            (`Published to customer:events`), the `eventId`, the resulting status, a matched-workflow
            count and an action count.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  # ───────────────────────────────────────────────────────────────────────────
  # process
  # ───────────────────────────────────────────────────────────────────────────

  /api/v1/process/instances:
    get:
      tags: [process]
      operationId: findProcessInstances
      summary: Cases — running, waiting, escalated
      description: |
        **Owned by `modules/process.md` §5a.1** — the section this contract is generated from.

        `design/screens/process.md` §1 · `modules/process.md` §5 (`ProcessClient.findInstances`).

        **RBAC: `process:instance:read : domain:<domain>`** — scope is `process_definitions.domain`,
        and *"an instance inherits the scope of the version it is pinned to, so a reviewer holding
        `domain:compliance` never sees a treasury case."*

        **Default: `open` — `status IN (running, waiting, escalated)` — with no time window**
        (DD-process-04). The no-time-window choice is deliberate and defended: *"Events default to
        24h because they are high-volume and short-lived. A case is neither; a time default hides
        the old stuck case the screen exists to find."*

        The default does hide `failed` and `expired`, and that is handled **elsewhere rather than by
        changing it**: `design/patterns.md` §4.2 carries `process_instances.status IN (failed,
        expired)` as an Attention queue condition, and this screen ships a saved view for it. Two
        surfaces, one condition, neither of them a changed default.

        **Live**, push-based, no poll interval — `process.step.entered/.completed/.failed` exist
        *"to drive the UI without polling"*. Page size 50 (`1–50 of 340`).

        **This list must not compose.** `modules`-level open question OQ-1 in
        `design/screens/process.md` settles it: `getInstance` resolves `task_id`, `invocation_id` and
        `report_run_id` through their clients and returns the assignee, the SLA and the invocation
        status composed; **`findInstances` must not.** That is why the list column is
        `Blocked on: step_code` — a `process` field — and *"the list is not allowed to grow an
        assignee column."*
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: |
            Filter chip. ⚠️ No wire name or encoding is stated for any filter on this screen; the
            source says only *"chips above the table, state in the URL"* and names them as labels:
            `open` · `status` · `definition` · `subject type` · `subject ref` · `stuck at step` ·
            `no timer` · `scope`.
        - name: definition
          in: query
          schema:
            type: string
          description: Filter chip; wire name not stated.
        - name: scope
          in: query
          schema:
            type: string
          description: Filter chip; wire name not stated. Scope is `process_definitions.domain`.
      responses:
        '200':
          description: |
            `Page<ProcessInstanceDto>`. ⚠️ **Shape UNSPECIFIED.** Note `current_step_codes` and
            `context` are **derived, with no column** — computed fields if they appear at all.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/process/instances/{id}:
    get:
      tags: [process]
      operationId: getProcessInstance
      summary: Case detail — steps, signals, timers
      description: |
        **Owned by `modules/process.md` §5a.1** — the section this contract is generated from.

        `design/screens/process.md` §2 · `modules/process.md` §5 (`ProcessClient.getInstance`).

        **RBAC: `process:instance:read : domain:<domain>`.**

        **This endpoint composes** where the list must not (OQ-1): it resolves `task_id`,
        `invocation_id` and `report_run_id` through their owning modules' clients and returns the
        assignee, the SLA and the invocation status already joined.

        **Live**, from the same `process.step.*` channel as the list; the counter, step list and
        timer countdown update in place and *"the panel never reorders or closes under a reading
        eye."*

        Signals: **every `process_signals` row, applied or not, newest first**. A signal for a step
        that is not waiting is **not an error** — it is recorded with a `rejection_reason` and
        surfaced, because *"late provider callbacks after a step has already expired are a real and
        frequent event, and they carry information worth keeping"* (`modules/process.md` §5). No
        default filter removes them and no *hide rejected* toggle exists (DD-process-07).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
