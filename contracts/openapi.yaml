  # ───────────────────────────────────────────────────────────────────────────
  # task
  # ───────────────────────────────────────────────────────────────────────────

  /api/v1/task/tasks:
    get:
      tags: [task]
      operationId: findTasks
      summary: Tasks — my queue, a team queue, or a filtered set
      description: |
        **Owned by `modules/task.md` §5a.1** — the section this contract is generated from.

        `design/screens/task.md` §1, §2, §4 · `modules/task.md` §5 (`TaskClient.find`).
        One endpoint backs three screens; the parameters are what separate them.

        **RBAC: `task:read : queue:<code>`.** Scope is the third dimension of §11 and the one that
        matters operationally: *"a compliance reviewer may `task:read` within `queue:compliance` but
        not within `queue:treasury`."* A task's scope is **derived once at creation** from
        `subject_types.scope_selector` (the subject half) and `task_types.domain` (the type half),
        yielding `queue:<domain>`.

        **A list endpoint does not resolve through the enforcer** (§11): there is no row yet, so the
        enforcer yields the *set* of scope labels the subject holds and the repository filters —
        `WHERE (scopes = '{}' OR scopes && :granted_scopes)`. **The `scopes = '{}'` arm is
        mandatory**: §13.8 defines an empty array as *unscoped and visible*, and omitting the clause
        hides every unscoped row from everyone *"while looking exactly like a permissions bug."*

        **`/tasks/mine` default: `state: open`, `assignee = me`, no time bound**, sorted **`due_at`
        ascending, nulls last** — *"an operator's own queue is small enough that a time bound would
        only hide work."* **Polled 30s**; SLA meters advance client-side from `due_at`, so the
        deadline is never stale even when the list is.

        **`/tasks/queues` default: `unclaimed`, all queues in scope. Polled 15s** — tighter, because
        *"two people opening the same unclaimed row is the failure mode this screen has and the other
        does not."* Queues the user has no scope for are **absent, not empty**.

        ⚠️ **No collection endpoint for task types is named anywhere**, though `/task/types` is a
        list screen with `domain` and `active` filters. Only `/api/v1/task/types/{code}` exists.
      parameters:
        - name: assignee
          in: query
          schema:
            type: string
          description: '`?assignee=me` — rows where `assignee_person_id = me`.'
        - name: state
          in: query
          schema:
            type: string
          description: |
            `?state=open`. **`open` is the three non-terminal states** — `not_started` ·
            `in_progress` · `blocked` — defined by exclusion:
            `state NOT IN ('done','rejected','cancelled','expired')`. The source explicitly corrects
            an earlier "four".
        - name: scope
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: |
            **Repeatable** — `?scope=queue:compliance&scope=partner:4711`. A containment query on
            `tasks.scopes text[]` (GIN-indexed). *"A task may carry more than one label, so
            `queue:compliance` and `partner:4711` narrow independently and the filter bar must allow
            both."* An empty array on the row means unscoped and visible to anyone holding
            `task:read`.
        - name: unclaimed
          in: query
          schema:
            type: boolean
          description: '`?unclaimed=true` — assigned to a team, not to a person. The Team queues default.'
        - name: type
          in: query
          schema:
            type: string
          description: '`?type=…` — `type_code = code`. Used by the task-type editor for its open-task count.'
        - name: countOnly
          in: query
          schema:
            type: boolean
          description: |
            `?countOnly=true` — count without rows. Used for the task-type editor's blast-radius
            figure, and mirrored by `GET /api/v1/audit/entries?countOnly=true`.
      responses:
        '200':
          description: |
            `Page<TaskDto>`. ⚠️ **Shape UNSPECIFIED.** ⚠️ **Page size is stated nowhere for this
            endpoint** — the only footer in the source reads `1–9 of 9`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/task/tasks/{id}:
    get:
      tags: [task]
      operationId: getTask
      summary: Task detail
      description: |
        **Owned by `modules/task.md` §5a.1** — the section this contract is generated from.

        `design/screens/task.md` §3 · `modules/task.md` §5 (`TaskClient.get`).

        **RBAC: `task:read : queue:<code>`.**

        **Static after load**, refetched after every action and on window focus; the SLA meter ticks
        client-side. `Trace` and `History` load **on expand only** — *"`audit` is a compliance store
        and must never be a runtime dependency of an operational screen."*

        Fields: `tasks.title`, `.type_code`, `.state`, `.priority`, `.subject_type`, `.subject_ref`,
        `.due_at`, `.created_at`, `.breached_at`, `.assignee_person_id`, `.assignee_team_id`,
        `.process_instance_id`, `.process_step_code`, `.form_data`, `.outcome`;
        `task_types.hard_deadline`; the `ruleId` from `resolveResponsible` that explains **why this
        person** — *"'the system chose this person' is not an acceptable answer during an incident
        review"*; and `task_state_changes.*`, which is **included in the task response**, not a
        separate call.

        `process_instance_id` is carried **opaquely and must not be linked** to a `process` screen:
        *"the only cross-module route out of a task is `correlation_id` → `/audit/timeline/…`"*.

        ⚠️ **This response must also carry the legal target states, and does not yet say how.**
        `modules/task.md` §5a.3 rejected the companion `GET …/transitions` and moved DD-task-02's
        requirement here, because the legal set is `task_types.transitions` intersected with this
        task's state, **this actor's** permissions and the four-eyes exclusions — *"a property of one
        task read by one actor, which is exactly what `GET /tasks/{id}` already is."* No field name
        is specified for it anywhere; that is `design/screens/task.md` §7 Q2's to write, not this
        file's to invent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ⚠️ **Response shape UNSPECIFIED** beyond the field list above.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/task/tasks/{id}/claim:
    post:
      tags: [task]
      operationId: claimTask
      summary: Claim an unclaimed task
      description: |
        **Owned by `modules/task.md` §5a.1** — the section this contract is generated from.

        `design/screens/task.md` §2. **RBAC: `task:claim : queue:<code>`.**

        Claiming sets `assignee_person_id` **and** transitions `not_started → in_progress` in one
        action. The claim race is the reason `/tasks/queues` polls at 15s rather than 30s; a lost
        race removes the row on the next poll.

        ⚠️ **Bulk claim is offered by the UI** (with a per-item breakdown) **and has no endpoint** —
        the only path is singular. Not emitted.

        **No client method, and that absence is the specification** (`modules/task.md` §5a.2). §5 states it
        for completion — *"a machine-callable 'mark this done' bypasses the four-eyes guard, the required
        comment, and the form validation — that is, all of the reasons the task existed"* — and *"claiming is
        the same argument one step earlier."* Claim and transition exist **only** over HTTP, with the actor's
        own bearer token. **This is the one module where the HTTP surface is deliberately larger than the
        client contract rather than a projection of it.**

        ⚠️ **Bulk claim is offered by the UI, with a per-item breakdown, and has no endpoint** — the only
        path is singular.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        description: ⚠️ **Request body UNSPECIFIED.**
        content:
          application/json:
            schema: {}
      responses:
        '200':
          description: ⚠️ **Response shape UNSPECIFIED.**
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Already claimed by someone else. ⚠️ Not specified as a status code anywhere; the screen
            describes the outcome (*"the row leaves on the next poll"*) rather than the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/task/tasks/{id}/transitions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    # ─────────────────────────────────────────────────────────────────────────
    # REMOVED 2026-07-28 — `GET /api/v1/task/tasks/{id}/transitions`, operationId
    # `getTaskLegalTransitions`. **Rejected by `modules/task.md` §5a.3**, the section that now owns
    # this module's HTTP surface. It was emitted here only because
    # `design/screens/task.md` §7 Q2 wrote it, and that document called it "this document's
    # placeholder, not a module-doc fact."
    #
    # The need behind it is real: §4 of `modules/task.md` says an illegal transition is rejected
    # "with the list of legal targets, which is what makes the UI able to render exactly the buttons
    # that will work" — but a rejection arrives AFTER the attempt, so it cannot render the buttons
    # that precede it. DD-task-02 caught that circularity. It is a defect in §4's sentence, not a
    # missing endpoint.
    #
    # A second GET is the wrong fix. The legal-target set is `task_types.transitions` intersected
    # with the task's current state, the actor's permissions and the four-eyes exclusions — a
    # property of ONE TASK READ BY ONE ACTOR, which `GET /api/v1/task/tasks/{id}` already is. A
    # separate GET costs a round trip whose answer can disagree with the response that rendered the
    # screen, and the window in which it disagrees is the same window the claim race lives in. It
    # cannot ride on `GET /api/v1/task/types/{code}` either: the type endpoint is global and
    # cacheable, and the legal set is neither.
    #
    # The requirement moves onto the task-detail response. `design/screens/task.md` §7 Q2 must
    # change; this file must not re-grow the path.
    # ─────────────────────────────────────────────────────────────────────────
    post:
      tags: [task]
      operationId: transitionTask
      summary: Move a task to a new state
      description: |
        **Owned by `modules/task.md` §5a.1** — the section this contract is generated from.

        `design/screens/task.md` §3. The single write behind Start, Complete, Reject, Block,
        Unblock, Cancel and Reassign.

        **RBAC varies by target state**, all scoped `queue:<code>`: `task:update` (Start, Block,
        Unblock), `task:complete` (Complete, Reject), `task:cancel` (Cancel),
        `task:reassign` (Reassign).

        **There is deliberately no machine-callable completion.** `modules/task.md` §5:
        *"There is no `complete()` on the client. Completion is a human action performed through
        `task`'s own HTTP API with the actor's own credentials. A machine-callable 'mark this done'
        bypasses the four-eyes guard, the required comment, and the form validation — that is, all of
        the reasons the task existed."* This endpoint is that HTTP API, and its bearer token is the
        actor's own.

        `cancel()` *is* on the client, because a process that fails must be able to close the work it
        opened — but cancellation is not completion: it produces no outcome and satisfies nothing.

        Server-side obligations this body must satisfy: a validated `form_data` against
        `task_types.form_schema`, an `outcome` from `task_types.outcome_values`, a **comment where
        `task_types.require_comment_on` matches**, and a **required `reason` for Block, Reassign and
        Cancel** (`design/patterns.md` §6).
      requestBody:
        required: true
        description: |
          ⚠️ **Request body UNSPECIFIED.** It must carry the target state, an outcome, form data, and
          a comment or reason depending on the transition — **no field name is given for any of
          them** anywhere in the spike.
        content:
          application/json:
            schema: {}
      responses:
        '200':
          description: ⚠️ **Response shape UNSPECIFIED.**
        '400':
          description: |
            Illegal transition, failed form validation, or a missing required comment/reason.
            **The legal targets are returned on rejection, and that stays exactly as it is**
            (`modules/task.md` §5a.3): it *"remains the right answer to a lost race, it is simply not
            the answer to 'which buttons do I draw'"* — which is why the companion
