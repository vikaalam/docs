        **Owned by `modules/audit.md` §5a.1** — the section this contract is generated from.

        `design/screens/audit.md` §5 · `modules/audit.md` §5 (`AuditClient.verifySeals(from, to)`).

        **RBAC: `audit:seal:verify:*`** — global.

        Emitted as `GET` because that is how the source writes it, though it performs a Merkle
        recomputation — which is why it is **manual, never on a timer**, and why the range is
        described as *"the cost"*.

        ⚠️ **The response shape is explicitly unspecified, and the source says so**: *"the shape of
        `SealVerification` is not specified in `audit.md` §5. This screen needs three things from it,
