  # ───────────────────────────────────────────────────────────────────────────
  # reporting
  #
  # ⚠️ This module names ZERO write endpoints across 483 lines of screen doc, despite
  #    13 distinct mutating actions each carrying an RBAC string and a confirmation
  #    dialog: New definition · Create draft from vN · Save draft · Publish ·
  #    Discard draft · Run report · Download artifact · Submit · Re-run · Place /
  #    release legal hold · Backfill / replay · Retry · Re-file. None is emitted.
  #    `Mark acknowledged` is an explicit negative — "Does not exist" — and must not
  #    be added: "we sent it" and "they have it" are different claims, and only one
  #    survives an audit.
  # ───────────────────────────────────────────────────────────────────────────

  /api/v1/reporting/definitions:
    get:
      tags: [reporting]
      operationId: findReportDefinitions
