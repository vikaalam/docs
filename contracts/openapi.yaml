        **Owned by `modules/automation.md` §5a.1** — the section this contract is generated from.

        `design/screens/automation.md` §3, §6, §10. **RBAC: `automation:event_type:read : domain:<d>`.**

        Also the prefill source for the consequence preview and the simulator — `.sample_envelope`
