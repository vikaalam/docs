  /api/v1/audit/legal-holds:
    get:
      tags: [audit]
      operationId: findLegalHolds
      summary: Legal holds
      description: |
        **Owned by `modules/audit.md` §5a.1** — the section this contract is generated from.

        `modules/audit.md` §5a.1 · `design/screens/audit.md` §6, §7.

        **RBAC: `audit:legal_hold:read : *`** — the module table's value, in the spaced grammar
        unlike the rest of this module. ⚠️ `design/screens/audit.md` names
        `audit:legal_hold:place:*` as the screen's primary; **the owning module wins** and the read
        permission is emitted.

        **Filters:** `state` (**default `active`**), `placed by`, `date range`, free text over
        `reason`. **Static.** `released_at IS NULL` is what `active` means.

        Columns: `legal_holds.scope` (jsonb — `{ correlationId }` or
        `{ subjectType, subjectRef }`), `.placed_at`, `.placed_by`, `.released_at`, `.released_by`,
        `.reason`.

        A hold *"copies and exports nothing, and releasing one deletes nothing immediately — it
        removes the refusal standing between those entries and the next retention run"*, which runs
        under a credential whose only privilege is `DROP PARTITION`.

        **`Place hold` and `Release hold` now have paths** — the `POST`s below. Until 2026-07-28
        this file said they did not, on the strength of `design/screens/audit.md` reading their
        absence from `AuditClient` as *"this design's assumption."* `modules/audit.md` §5a.3 rules
        the other way: *"It is not an assumption; it is a missing method."* §7 of that document
        already listed `/audit/legal-holds` among this module's screens with the contents *"Place and
        release holds; both actions audited"*, and §4 makes a hold the thing that **suspends key
        destruction**. Only the module that owns the retention job, the partitions, and the refusal
        can place one.

        ⚠️ **The "entries under hold" count has no endpoint and no column**, marked
        `(not specified — see below)` in the source and carried forward unresolved by
        `modules/audit.md` §5a.3: `legal_holds` has no `entry_count` or `artifact_count`, the number
        must be computed from `scope` at read time, **no such query is specified, and both
        confirmation dialogs depend on it.** `LegalHoldDto` cannot be specified until it is.

        **Adopted — this operation has no client method** (`modules/audit.md` §5a.3). `AuditClient`
        must gain:

        ```ts
        abstract findLegalHolds(q: LegalHoldQuery): Promise<LegalHoldDto[]>;
        ```
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: active
        - name: subject
          in: query
          schema:
            type: string
          description: |
            `?subject=…` — used by the erasure screen's interlock to find holds whose `scope`
            matches a subject and whose `released_at IS NULL`. Value encoding not stated.
      responses:
        '200':
          description: '⚠️ **Shape UNSPECIFIED** beyond the column list above.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [audit]
      operationId: placeLegalHold
      summary: Place a legal hold
      description: |
        **Owned by `modules/audit.md` §5a.1** — the section this contract is generated from.

        `modules/audit.md` §5a.1 (added 2026-07-28) · §4 · §7 · ADR-26.

        **RBAC: `audit:legal_hold:write : *`** — global, in the module table's spelling.

        A hold *"copies and exports nothing"*. What it does is **refuse**: an open hold whose `scope`
        matches a subject refuses destruction of that subject's `platform.subject_keys` row, and
        **the refusal is itself audited with `outcome: rejected`** (§3, ADR-26). It also stands
        between the entries it covers and the next retention run — which executes under a credential
        whose only privilege is `DROP PARTITION`.

        Placing a hold is itself audited, like every write in this module.

        **Adopted — this operation has no client method** (`modules/audit.md` §5a.3: *"Adopt the
        capability"*). `AuditClient` must gain:

        ```ts
        abstract placeLegalHold(cmd: PlaceLegalHoldCommand): Promise<LegalHoldRef>;
        ```

        Only the module that owns the retention job, the partitions, and the refusal can place one,
        which is why the method belongs on this contract rather than in a controller.
      requestBody:
        required: true
        description: |
          ⚠️ **Request body UNSPECIFIED as fields.** The columns it must populate are known from §3 —
          `legal_holds.scope` (jsonb, either `{ correlationId }` or `{ subjectType, subjectRef }`)
          and `.reason`; `placed_by` and `placed_at` are server-set. **No field names, and no shape
          for `PlaceLegalHoldCommand`, are written anywhere in the spike.**
        content:
          application/json:
            schema: {}
      responses:
        '201':
          description: |
            Placed. ⚠️ **Response shape UNSPECIFIED** — `LegalHoldRef` is named by §5a.3 and defined
            nowhere. ⚠️ Whether the success code is `200` or `201` is stated nowhere either.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/audit/legal-holds/{id}/release:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: '`legal_holds.id`.'
    post:
      tags: [audit]
      operationId: releaseLegalHold
      summary: Release a legal hold
      description: |
        **Owned by `modules/audit.md` §5a.1** — the section this contract is generated from.

        `modules/audit.md` §5a.1 (added 2026-07-28) · §4 · §7.

        **RBAC: `audit:legal_hold:write : *`** — global. Note it is the **same** permission as
        placing; the module table does not split them.

        **Releasing deletes nothing immediately** — *"it removes the refusal standing between those
        entries and the next retention run."* It also un-blocks any erasure request parked on this
        hold: a blocked request stays `pending` with `blocking_hold_id` set, *"it is not `rejected`,
        because nobody decided it"*, and **when the hold releases the request is still there and
        still owed an answer** (§4). Releasing is audited.

        **Adopted — this operation has no client method** (`modules/audit.md` §5a.3). `AuditClient`
        must gain:

        ```ts
        abstract releaseLegalHold(id: string, reason: string, actor: ActorRef): Promise<void>;
        ```
      requestBody:
        required: true
        description: |
          ⚠️ **Request body UNSPECIFIED as fields.** §5a.3's method signature makes a `reason`
          required and an `actor` explicit; `legal_holds.released_by` and `.released_at` are the
          columns behind them. **No field names are written anywhere.** Whether `actor` travels in
          the body or is derived from the bearer token's `email` claim (§11.1, as `replay` does) is
          not stated — the second reading is the one every other operator write in this contract
          takes.
        content:
          application/json:
            schema: {}
      responses:
        '200':
          description: Released. ⚠️ **Response shape UNSPECIFIED**; the client method returns `void`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            ⚠️ **Not stated in the source.** Emitted for the one case §4 makes structural: a hold
            already released (`released_at IS NOT NULL`) cannot be released again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  # ───────────────────────────────────────────────────────────────────────────
  # audit — erasure requests. Three operations added 2026-07-28 alongside the
  # table `audit.erasure_requests` (`modules/audit.md` §3, §4, §5a.5). Before
  # that day the Erasure screen had been rendering a five-state lifecycle
  # against a schema that modelled none of it, and this file emitted no path.
  #
  # All three belong to `audit` "because nothing else can hold them — the
  # decision reads `legal_holds` in the same schema, and rule 6 says a module
  # owns its own tables." Erasure ITSELF is `platform`'s operation on
  # `platform.subject_keys`; this module owns the request, the hold that
  # refuses it, and the entry that records the refusal.
  # ───────────────────────────────────────────────────────────────────────────

  /api/v1/audit/erasure-requests:
    get:
      tags: [audit]
      operationId: findErasureRequests
      summary: The erasure queue
      description: |
        **Owned by `modules/audit.md` §5a.1** — the section this contract is generated from.

        `modules/audit.md` §5a.1, §5a.5 (added 2026-07-28) · §3 · §4.

        **RBAC: `audit:erasure:read : *`** — global.

        **`?status=` defaults to the open set**, and the reason is a legal obligation rather than a
        convenience: *"a request a hold blocked stays `pending` and is still owed an answer."* A
        blocked request carries `blocking_hold_id` and is **not** `rejected` — nobody decided it —
        so a default that hid `pending` would quietly lose the obligation.

        **`status` is the lifecycle of the request, never the state of the data.**
        `erasure_requests.status` is `pending · approved · rejected · executing · completed ·
        failed` and deliberately has **no `destroyed` value**: whether the personal data is actually
        gone is `platform.subject_keys.state`, read through
        `GET /api/v1/platform/subject-keys`. *"A screen showing an erasure row reads both, and if
        they ever disagree the key wins"* (§4).

        Columns (§3): `subject_type`, `subject_ref` (**the pair, never the ref alone** — ADR-29),
        `subject_key_id` (a bare identifier, never a FK — rule 3; null until the key is located),
        `status`, `legal_basis`, `requested_by`, `requested_at`, `decided_by`, `decided_at`,
        `decision_reason`, `blocking_hold_id` (→ `legal_holds.id`, same schema so this one **is** a
        FK), `executed_at` (*"when the destroy was ISSUED, not when it was proven"*), `failure`,
        `correlation_id`, `causation_id`.

        **Adopted — this operation has no client method** (`modules/audit.md` §5a.5). `AuditClient`
        must gain `findErasureRequests`.

        ⚠️ **No signature is written for it**, and no query type is named — unlike §5a.3's four
        adopts, §5a.5 names the three methods and stops. Emitted as named; not invented.
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: |
            **Default: the open set.** ⚠️ Which of the six values that set contains is **not
            enumerated anywhere** — `pending` is the only one the source names explicitly, via the
            blocked-request rule. Whether the parameter is repeatable is not stated either.
        - name: subjectType
          in: query
          schema:
            type: string
          description: '⚠️ Not named in the source; the `(subject_type, subject_ref)` pair is (ADR-29).'
        - name: subjectRef
          in: query
          schema:
            type: string
          description: '⚠️ Not named in the source.'
      responses:
        '200':
          description: '⚠️ **Shape UNSPECIFIED** beyond the column list above. No pagination surface is stated.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [audit]
      operationId: requestErasure
      summary: Raise an erasure request
      description: |
        **Owned by `modules/audit.md` §5a.1** — the section this contract is generated from.

        `modules/audit.md` §5a.1, §5a.5 (added 2026-07-28) · §3 · §4.

        **RBAC: `audit:erasure:request : *`** — global, and **granted separately from
        `audit:erasure:decide : *`**, *"or the split is decorative."*

        **`legal_basis` is required**: *"a refusal must be able to cite what it refused."* It is
        `NOT NULL` in §3, so this is a database fact rather than a form rule.

        Raising a request destroys nothing and approves nothing. The row enters at `pending`, and if
        an open legal hold matches the subject it **stays** `pending` with `blocking_hold_id` set.

        **Adopted — this operation has no client method** (`modules/audit.md` §5a.5). `AuditClient`
        must gain `requestErasure`. ⚠️ No signature is written for it.
      requestBody:
        required: true
        description: |
          ⚠️ **Request body UNSPECIFIED as fields.** The `NOT NULL` columns it must populate are
          known from §3 — `subject_type`, `subject_ref`, `legal_basis`, `requested_by`,
          `requested_at`, `correlation_id` — but **no field names are written**, and whether
          `requested_by` comes from the body or the bearer token's `email` claim (§11.1) is not
          stated. `requested_by` is one half of the maker-checker CHECK, so where it comes from is
          not a detail.
        content:
          application/json:
            schema: {}
      responses:
        '201':
          description: |
            Raised. ⚠️ **Response shape UNSPECIFIED**, and ⚠️ whether the success code is `200` or
            `201` is stated nowhere.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/audit/erasure-requests/{id}/decide:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: '`erasure_requests.id`.'
    post:
      tags: [audit]
      operationId: decideErasureRequest
      summary: Approve or reject an erasure request
      description: |
        **Owned by `modules/audit.md` §5a.1** — the section this contract is generated from.

        `modules/audit.md` §5a.1, §5a.5 (added 2026-07-28) · §3 · §4.

        **RBAC: `audit:erasure:decide : *`** — global, and **granted separately from
        `audit:erasure:request : *`**.

        **The caller may not be the requester, and the endpoint is not what enforces it.**
        `erasure_requests_maker_checker_ck` — a CHECK constraint, `requested_by <> decided_by` —
        refuses the write in the database. *"The controller returning `409` first is a courtesy so
        the operator sees a sentence rather than a constraint name; it is not the control. Erasure is
        irreversible and has no compensating action, so the guard sits where no code path can route
        around it"* (§5a.5). Where the approval is driven by a process instead,
        `fourEyes.excludeTriggerActor: true` excludes the requester at resolution time as well —
        belt and braces, both added the same week for the same reason.

        **This operation destroys nothing.** It moves the request to `approved` or `rejected`;
        execution is a **separate step** whose outcome is `platform.subject_keys.state`, not this
        table's `status`. *"An endpoint that both approved and destroyed would make the four-eyes
        control and the irreversible act one transaction — the reviewer would have no moment in which
        to be wrong."* The destroy itself is `POST /api/v1/platform/subject-keys/destroy`, which is a
        `platform` path this module does not own.

        `decision_reason` is `NOT NULL` when the decision is `rejected` (a CHECK in §3).

        **Adopted — this operation has no client method** (`modules/audit.md` §5a.5). `AuditClient`
        must gain `decideErasure` — *"the only method in this module that **writes a decision rather
        than a record**, which is why it carries its own permission."* ⚠️ No signature is written
        for it.
      requestBody:
        required: true
        description: |
          ⚠️ **Request body UNSPECIFIED as fields.** It must carry the decision (`approved` or
          `rejected`) and, when rejecting, a `decision_reason`; `decided_by` and `decided_at` are the
          remaining columns. **No field names are written anywhere.** As with `requested_by`, where
          `decided_by` comes from matters — it is the other half of the maker-checker CHECK.
        content:
          application/json:
            schema: {}
      responses:
        '200':
          description: Decided. ⚠️ **Response shape UNSPECIFIED.**
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            **Maker-checker refusal — the caller is the requester** (`requested_by = decided_by`).
            §5a.5 names `409` for this explicitly, and equally explicitly says the status code is a
            courtesy: the database CHECK is the control, and it refuses the write whether or not the
            controller looked first.

            ⚠️ Also the plausible code for deciding a request that is not `pending`, and for one
            blocked by an open `blocking_hold_id` — **neither is stated.**
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  # ───────────────────────────────────────────────────────────────────────────
  # platform — not a module, and owned by none of the eight. `design/open-questions.md` G-06.
  # ───────────────────────────────────────────────────────────────────────────

  /api/v1/platform/subject-keys:
    get:
      tags: [platform]
      operationId: findSubjectKeys
      summary: Crypto-shredding key state for one subject
      description: |
        `design/screens/audit.md` §7 · `ARCHITECTURE.md` §13.5, ADR-26.

        **RBAC: `platform:subject_key:destroy:*`** is the erasure screen's declared permission;
        a separate read permission is not named. ⚠️ Note this path is rendered on an `audit` screen
        but lives in the `platform` namespace with a `platform:` permission — the route-prefix guard
        of §11 would therefore look for `module:platform:access`, and **no such module exists**.

        `platform.subject_keys` is the registry that makes ADR-19 erasure provable: *"a key per
        module — erasure would then be N operations that can partially fail, which is not erasure.
        Deriving keys from a KMS on the fly with no registry — nothing then records that a key was
        destroyed, so an erasure cannot be *proven*."* A partial unique index makes *one active key
        per subject* a database fact.

        Columns: `key_version`, `.state` (`active` · `rotated` · `destroyed`), `.created_at`,
        `.rotated_at`, `.destroyed_at`, `.destroyed_by`.

        `modules/audit.md` §5a.1 records this path as **adjacent but not owned**: it renders on the
        `/audit/erasure` screen, but it carries a `platform:` permission and a `/api/v1/platform` prefix, and
        is *"listed here only so its absence from the table is not read as an omission."*

        **Erasure is `platform`'s operation on `platform.subject_keys`; `audit` owns the hold that refuses it,
        the request lifecycle (`audit.erasure_requests`), and the entry that records the refusal.**

        ⚠️ **No module owns this path.** `ARCHITECTURE.md` §4 names eight modules and `platform` is not
        one of them. It is kept here, tagged `platform`, because it is real and rendered — but it is outside
        the ownership settled by `design/open-questions.md` **G-05**, under which every other operation in
        this contract is owned by a `modules/*.md` `§5a`/`§4a` section.

        **The open question is `design/open-questions.md` G-06**: §11 resolves a route prefix to a module for
        its `module:<name>:access` guard, and there is no `platform` module to resolve to (§13.5 — owned by no
        module). *"Either the routes belong to `audit`, or `platform` needs a guard rule of its own."* Until
        that is answered, the first of §11's two guards has nothing to check on this path.
      parameters:
        - name: subjectType
          in: query
          schema:
            type: string
        - name: subjectRef
          in: query
          schema:
            type: string
        - name: impact
          in: query
          schema:
            type: string
            enum: ['1']
          description: |
            `?impact=1` — `count(*)` per store where `subject_key_id` matches **any version**, across
            `automation.records`, `notification.deliveries`, `integration.invocations`,
            `reporting.report_facts` and `platform.artifacts`. *"Counts are **queried, not
            estimated**."*
      responses:
        '200':
          description: '⚠️ **Shape UNSPECIFIED** beyond the column list above.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/platform/subject-keys/destroy:
    post:
      tags: [platform]
      operationId: destroySubjectKey
      summary: Erase a subject by destroying its data key
      description: |
        `design/screens/audit.md` §7 · `ARCHITECTURE.md` §21 · B5, ADR-19, ADR-26.

        **RBAC: `platform:subject_key:destroy : *`** — global. (The same permission appears in both
        grammars within one file: `platform:subject_key:destroy:*` and the spaced form.)

        **Irreversible.** Erasure is one `UPDATE` on one row: the wrapped key is destroyed, the rows
        are not. Row structure and count are unchanged — *"status, timing, channels, and
        `no_recipient` still answer operational questions"* — and **the row count after erasure is
        identical**. Partition drop at 18 months remains the normal expiry path; erasure is the
        *early* path, not a replacement.

        **Interlocked with legal hold.** A hold suspends key destruction, and **the refusal is
        itself audited with `outcome: rejected`** — as is a successful destruction. The screen reads
        `GET /api/v1/audit/legal-holds?subject=…` before offering the action.

        Confirmation is type-to-confirm the subject reference.

        **This is the one item in §21 that cannot be retrofitted** (B5): retrofitting means
        re-encrypting a history that is partitioned, append-only in practice, and already replicated
        into backups.

        `modules/audit.md` §5a.1 records this path as **adjacent but not owned**, for the same reason as
        `GET /api/v1/platform/subject-keys`.

        It is also the step **`POST /api/v1/audit/erasure-requests/{id}/decide` deliberately does not
        perform**: approving and destroying are separate operations because *"an endpoint that both approved
        and destroyed would make the four-eyes control and the irreversible act one transaction — the reviewer
        would have no moment in which to be wrong"* (`modules/audit.md` §5a.5). `erasure_requests.status`
        answers *what happened to the request*; `subject_keys.state` answers *is it gone* — and if they
        disagree, the key wins.

        ⚠️ **No module owns this path.** `ARCHITECTURE.md` §4 names eight modules and `platform` is not
        one of them. It is kept here, tagged `platform`, because it is real and rendered — but it is outside
        the ownership settled by `design/open-questions.md` **G-05**, under which every other operation in
        this contract is owned by a `modules/*.md` `§5a`/`§4a` section.

        **The open question is `design/open-questions.md` G-06**: §11 resolves a route prefix to a module for
        its `module:<name>:access` guard, and there is no `platform` module to resolve to (§13.5 — owned by no
        module). *"Either the routes belong to `audit`, or `platform` needs a guard rule of its own."* Until
        that is answered, the first of §11's two guards has nothing to check on this path.
      requestBody:
        required: true
        description: |
          ⚠️ **Request body UNSPECIFIED as fields.** Inferable from the form: a subject `type` and a
          `reference`. No field names are given.
        content:
          application/json:
            schema: {}
      responses:
        '200':
          description: |
            ⚠️ **Response shape UNSPECIFIED.** The screen *"reloads after the operation and shows the
            destroyed state."*
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Refused — either the permission is missing, **or a legal hold covers this subject**. The
            refusal writes its own audit entry with `outcome: rejected`. ⚠️ Whether the hold refusal
            is a `403` or a `409` is not stated anywhere.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/health/capabilities:
    get:
      tags: [platform]
      operationId: getCapabilityHealth
      summary: Capability driver report
      description: |
        `ARCHITECTURE.md` §6 · `design/app-shell.md` §2, §7.2 · `design/screens/notification.md` §1
        (which reads it for the degraded strip, sourced as `Notifier.health()`).

        ⚠️ **Written two ways**: `design/app-shell.md` §8 lists the route as `/health/capabilities`;
        `design/screens/notification.md` calls the API as `/api/v1/health/capabilities`. The
        prefixed form is emitted because it is the one written as an API path.

        **RBAC: not stated as a permission string, but `ARCHITECTURE.md` §21 · B10 makes it a
        blocking slice-0 requirement that this endpoint is AUTHENTICATED** — *"it reports which
        drivers exist and whether they are healthy — infrastructure topology handed to an
        unauthenticated caller."*

        *"A capability reports at boot whether its driver is present and healthy… A missing driver
        degrades one capability, never the process."* A method may be declared **optional**, and this
        report says which optional methods a driver actually implements.

        The rendered status is `ok` · `warn` · `error`, and **`error` is user-relative**: *"a
        capability required by a screen the user has access to is down."* That makes the top-level
        dot a per-principal computation, not a global one. `warn` explicitly means **the process is
        fine** — *"a red dot for a notifier outage would train people to ignore it during the outage
        that actually matters."*

        `modules/notification.md` §5a.1 records this path as **adjacent but not owned**: it is read by that
        module's screens for the degraded strip (sourced as `Notifier.health()`), *"but it is a `platform`
        path, not a `notification` one — §4 of `ARCHITECTURE.md` names eight modules and `platform` is not
        among them. It is listed here only so the absence is not read as an omission."*

        ⚠️ **No module owns this path.** `ARCHITECTURE.md` §4 names eight modules and `platform` is not
        one of them. It is kept here, tagged `platform`, because it is real and rendered — but it is outside
        the ownership settled by `design/open-questions.md` **G-05**, under which every other operation in
        this contract is owned by a `modules/*.md` `§5a`/`§4a` section.

        **The open question is `design/open-questions.md` G-06**: §11 resolves a route prefix to a module for
        its `module:<name>:access` guard, and there is no `platform` module to resolve to (§13.5 — owned by no
        module). *"Either the routes belong to `audit`, or `platform` needs a guard rule of its own."* Until
        that is answered, the first of §11's two guards has nothing to check on this path.
      responses:
        '200':
          description: |
            ⚠️ **Response shape UNSPECIFIED.** The status vocabulary `ok` · `warn` · `error` is the
            only enumerated part.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /health/live:
    get:
      tags: [platform]
      operationId: getLiveness
      summary: Liveness probe
      description: |
        `ARCHITECTURE.md` §15. **Deliberately outside `/api/v1` and outside authentication** — it is
        a probe, not an API. **RBAC: none, deliberately.** It carries no `/api/v1/<module>` prefix,
        so §11's route-prefix guard has no module to derive and does not apply.

        **Touches no dependency. Drives the restart policy.** §21 · B10: *"`/health/live` stays
        dependency-free. Already specified in §15. Keep it that way; the temptation to add a database
        check is constant."*

        Kept separate from `/health/ready` because *"merging them turns a momentary Redis blip into a
        restart loop."*

        **Not owned by any module, and not even inside `/api/v1/<module>`** — so §11's route-prefix guard
        has no module to derive and does not apply. That much is deliberate and settled (`ARCHITECTURE.md`
        §15): it is a probe, not an API.

        What is *not* settled is the same G-06 question the other four `platform` paths raise — see
        `GET /api/v1/health/capabilities`. For this path the practical answer is narrower: an unauthenticated,
        dependency-free probe needs no module and no guard.
      security: []
      responses:
        '200':
          description: Alive. ⚠️ **Response shape UNSPECIFIED.**
        '503':
          description: Not alive. ⚠️ **Not stated in the source**; emitted as the conventional pair to `200`.

  /health/ready:
    get:
      tags: [platform]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        `ARCHITECTURE.md` §15. **Checks database, stream, and notifier. Drives the load balancer.**
        **RBAC: none, deliberately** — same reasoning as `/health/live`. Note the contrast with
        `/api/v1/health/capabilities`, which §21 · B10 requires to be **authenticated**: readiness is
        a boolean, whereas the capability report is infrastructure topology.

        Related boot rule from §11.2: this platform **must still start when `auth-service` is
        unreachable *after* boot**, serving its last known policy snapshot and alerting — but it must
        **refuse to start** when the snapshot is unavailable *at* boot, because *"a process that
        starts with no policy denies every request — an outage wearing the costume of a bug."*

        **Not owned by any module, and not inside `/api/v1/<module>`** — §11's route-prefix guard has no
        module to derive and does not apply. Deliberate and settled (`ARCHITECTURE.md` §15).

        The contrast with `/api/v1/health/capabilities` is the part G-06 has to resolve: readiness is a
        boolean and is unauthenticated, while the capability report is infrastructure topology and §21 · B10
        requires it to be **authenticated** — by a guard that currently has no module to hang off.
      security: []
      responses:
        '200':
          description: Ready. ⚠️ **Response shape UNSPECIFIED.**
        '503':
          description: Not ready — a dependency is down. ⚠️ **Not stated in the source.**

