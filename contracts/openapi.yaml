      description: |
        **Owned by `modules/audit.md` §5a.1** — the section this contract is generated from.

        `design/screens/audit.md` §5. **RBAC: `audit:seal:verify:*`** is the screen's primary.

        **Filters: `date range` only, default last 7 days** — *"verification recomputes over stored
        entries, so the range is the cost."* The rendered range is 168 hourly intervals, i.e. one
        seal per hour over seven days.

        **Static, with a manual `Verify range`** — *"putting a Merkle recomputation on a timer makes
        a compliance store a scheduled load on the operational database."*

        Columns: `audit_seals.period_start`, `.period_end`, `.entry_count`, `.merkle_root`,
        `.previous_seal_id`, `.sealed_at`.

        **Adopted — this operation has no client method** (`modules/audit.md` §5a.3). `AuditClient`
        must gain:

        ```ts
        abstract findSeals(from: Date, to: Date): Promise<AuditSealDto[]>;
        ```

        **Separate from `verifySeals` because they cost different things.** Listing stored seal rows is a
        table scan; verifying recomputes a Merkle root over the entries in the range. *"One method doing both
