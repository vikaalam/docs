        `Create draft from v3`, `Save draft`, `Publish` and `Discard draft` all carry RBAC and no
        path. **Contrast `process`, whose equivalent screen names `PUT .../versions/{v}` and
        `POST .../versions/{v}/publish`** — the two modules specify the same shape of editor to
        different depths, and `reporting` is the shallower.

        **No client method — configuration** (`modules/reporting.md` §5a.2). Served by `internal/http/` over
        this module's own tables: *"nothing outside `reporting` reads a definition — `RunReportCommand`
        carries a `definitionCode` and this module resolves it to the latest published version itself."*
