  /api/v1/audit/seals/tail:
    get:
      tags: [audit]
      operationId: getUnsealedTail
      summary: Entries written since the last seal
      description: |
        **Owned by `modules/audit.md` §5a.1** — the section this contract is generated from.

        `design/screens/audit.md` §5. **RBAC: `audit:seal:verify:*`.**

        `count(audit_entries)` where `occurred_at > max(audit_seals.sealed_at)`.

        **The detection window is one interval** (DD-audit-10): a change made after the last seal is
        not yet covered by one, and this row names how many entries sit in that window. Without it
        the integrity screen would claim a guarantee it does not have for the most recent hour.

        **Adopted — this operation has no client method** (`modules/audit.md` §5a.3). `AuditClient`
        must gain:

        ```ts
        abstract unsealedTail(): Promise<{ entryCount: number; since: Date }>;
        ```

        It belongs on the contract rather than in a controller because the claim it makes is the seal chain's
        to make: *"without it the integrity screen claims a guarantee it does not have for the most recent
        hour — and the claim has to come from the module that owns the seal chain, not from a `count(*)` a
        controller writes for itself."*
      responses:
        '200':
          description: ⚠️ **Response shape UNSPECIFIED.**
        '401':
