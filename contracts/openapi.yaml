      description: |
        **Owned by `modules/automation.md` §5a.1** — the section this contract is generated from.

        `design/screens/automation.md` §4. Written in the source with an elided prefix
        (`POST …/subject-types/{code}/test`); reconstructed here from the surrounding `/api/v1/automation`
        context.

        **RBAC: `automation:subject_type:write : *`.**

        The point of running it **server-side** is that the same ref set the platform actually saw is
        re-tested against the proposed regex, so tightening a format states its cost before it is
        saved: *"Of the last 5,000 refs seen for this type, **412 would now be rejected as
        `invalid`**."* The derive affordance works from **the last 200 refs**.

        **Adopted — this operation has no client method** (`modules/automation.md` §5a.3). `AutomationClient`
        must gain:

        ```ts
        abstract testSubjectRefFormat(code: string, refFormat: string): Promise<RefFormatTest>;
        ```

        It re-tests the ref set **the ingest path actually saw**. A controller doing that directly is a second
        implementation of the ingest path, which §8 forbids in the one place it was noticed: *"a simulator
        that takes a different path tests a path that does not exist in production."*
