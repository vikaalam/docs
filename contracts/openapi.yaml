        spike.** Not emitted.

        **No client method, and it must not get one — configuration** (`modules/automation.md` §5a.2).
        The registry reads are served by `internal/http/` over `internal/repositories/`: *"nothing outside
        this module reads the matcher's own configuration, and putting it on the exported token would let any
        module that injects `AutomationClient` read — and, the first time somebody is in a hurry, write — the
        rules that decide what happens to every event in the platform."*
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ⚠️ **Response shape UNSPECIFIED** beyond the column list on the collection.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/automation/event-types/{code}/preview:
    post:
      tags: [automation]
      operationId: previewEventConsequence
      summary: 'Consequence preview — "what will this event actually do?"'
      description: |
        **Owned by `modules/automation.md` §5a.1** — the section this contract is generated from.

        `design/screens/automation.md` §6 · `modules/automation.md` §8. One of the three simulators
        (`design/patterns.md` §3).

        **RBAC: `automation:event_type:read : domain:<d>`.**

        Returns **all workflows that would match, in execution order** — matching does not *select*,
        it collects (§7.1) — with the resolved audience of each `notify` (via
        `directory.resolveResponsible`, carrying the `ruleId` that explains the choice) and the
        assignee of each `create_task`. It states what would **not** happen and why, including an
        `exclusive` workflow that would suppress everything, and renders an empty resolution as
        **`no_recipient` rather than as an error**.

        **`Preview` is never a step on the way to `Publish`** (`design/patterns.md` §3 rule 1):
        preview resolves and shows, publish emits. This is not a `dryRun` flag on another operation.

        **Static**, recomputed on `Preview`. No filters — the input panel is the query.

        **Adopted — this operation has no client method** (`modules/automation.md` §5a.3). `AutomationClient`
        must gain:

        ```ts
        abstract previewConsequence(q: ConsequencePreviewQuery): Promise<ConsequencePreview>;
        ```

        **It is not a `dryRun` flag on publish.** `design/patterns.md` §3 rule 1 keeps preview and publish as
        separate operations with different consequences. What it must return is the §7.1 answer, not a
        selection: **all** matching workflows in execution order, each `notify`'s resolved audience carrying
        the `ruleId` that explains it, and an empty resolution rendered as `no_recipient` rather than an
        error.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: window
          in: query
          schema:
            type: string
            default: 24h
          description: |
            `?window=24h` — the blast-radius multiplier, and **the same query and window as the
            registry's `24h` column** (§3), deliberately not a second number.
      requestBody:
        required: true
        description: |
          ⚠️ **Request body UNSPECIFIED as fields.** The form renders a subject `type`, a subject
          `ref`, and a `data` JSON block; no field names are given for the wire.
        content:
          application/json:
            schema: {}
      responses:
        '200':
          description: |
            ⚠️ **Response shape UNSPECIFIED as fields.** The rendered result carries, per candidate:
            an order mark, the workflow name, priority, disposition and `exclusive` flag, action
            lines of the form `→ <action_type> <target code>`, the resolved audience **with its
            `ruleId`**, and for a non-match the failing clause **with the resolved value**. Backing
            columns: `workflows.condition`, `.priority`, `.exclusive`, `.disposition`, `.active`,
            `.active_from`, `.active_to`; `workflow_actions.seq`, `.action_type`, `.config`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/automation/subject-types:
    get:
      tags: [automation]
      operationId: findSubjectTypes
      summary: Subject type registry
      description: |
        **Owned by `modules/automation.md` §5a.1** — the section this contract is generated from.

        `design/screens/automation.md` §4. **RBAC: `automation:subject_type:write : *`** (the
        screen's declared primary — subject types are **not** domain-scoped, because a subject type
        crosses domains).

        `subject.type` is the one part of the subject that **is** validated (§7.3): a typo
        (`custmer`) is caught as `invalid`, while a reference to a customer deleted upstream is not
        caught and is not supposed to be — `subject.ref` is never validated against a local table.

        **Filters:** `active` · `composite` · `provisional` · `unused`.
        **Default: `active`, `code` asc. Static** — *"a configuration screen does not twitch."*

        Columns: `subject_types.code`, `.name`, `.ref_format`, `.ref_note`, `.composite`,
        `.scope_selector`, `.active`.

        **`scope_selector` is load-bearing and silently fails.** `ARCHITECTURE.md` §13.8 derives a
        scope label **once at creation**; a selector naming a path no envelope of that subject type
        carries yields an empty array, and an empty array means *unscoped and visible to everyone
        holding the permission*. Nothing errors. `design/patterns.md` §4.2 carries it as a standing
        queue condition for exactly that reason.

        **No client method, and it must not get one — configuration** (`modules/automation.md` §5a.2).
        The registry reads are served by `internal/http/` over `internal/repositories/`: *"nothing outside
        this module reads the matcher's own configuration, and putting it on the exported token would let any
        module that injects `AutomationClient` read — and, the first time somebody is in a hurry, write — the
        rules that decide what happens to every event in the platform."*
      parameters:
        - name: window
          in: query
          schema:
