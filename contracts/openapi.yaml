            `PersonDto[]`. ⚠️ **Shape UNSPECIFIED.** Backing columns include
            `persons.display_name`, `.timezone`, `.local_enabled`, `.upstream_active`,
            `.projected_at`, `.contact`. ⚠️ **No pagination surface is mentioned anywhere on this
            screen** — no footer, no page size, no total.
