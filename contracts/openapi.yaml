  /api/v1/directory/responsibility/resolve:
    post:
      tags: [directory]
      operationId: resolveResponsible
      summary: 'Who is responsible for subject X — the single answer'
      description: |
        **Owned by `modules/directory.md` §4a.1** — the section this contract is generated from.

        `design/screens/directory.md` §4 · `modules/directory.md` §4
        (`DirectoryClient.resolveResponsible`). One of the three simulators
        (`design/patterns.md` §3).

        **RBAC: `directory:responsibility:read : domain:<name>`.**

        **On demand, no polling** — *"the result is a statement about one instant and is stamped with
        it; refreshing it under a reader would make the stamp a lie."*

        **An empty array is a valid, meaningful answer** that callers must handle as
        `no_recipient` — rendered as a result, never as an error. Downstream this is why a `notify`
        action ending `no_recipient` is **not `succeeded`** and makes its event `partial` (ADR-21).

        **The simulator is not a convenience**: *"a responsibility rule set with more than a dozen
        rows is unreadable as a table, and the first time anyone discovers a wrong rule should not be
        during an incident."*

        ⚠️ **PATH COLLISION.** `design/screens/task.md` §4 calls the same capability at
        `POST /api/v1/directory/responsibility/simulate`. `resolve` is emitted because it is the
        owning module's spelling and because `simulate` is already the **screen** route
        (`/directory/responsibility/simulate`) — one name cannot be both. Not silently merged;
        recorded here.
      requestBody:
        required: true
        description: |
          **`ResponsibilityQuery` — one of only three enumerated request bodies in the spike**
          (`modules/directory.md` §4). Fields are named; types below are from the TypeScript
          contract, not from a JSON Schema, and the wire encoding is not stated.
        content:
          application/json:
            schema:
              type: object
              description: |
                Transcribed from `modules/directory.md` §4's `ResponsibilityQuery`. ⚠️ The document
                declares a TypeScript interface, not a wire schema — field names are harvested,
                JSON types are inferred from their TS types, and nothing else is asserted.
              properties:
                domain:
                  type: string
                roles:
                  type: array
                  items:
                    type: string
                    enum: [primary, backup, observer, approver]
                  description: '`OwnerRole[]`.'
                subjectType:
                  type: string
                subjectRef:
                  type: string
                  description: |
                    Opaque (§7.3). **Never validated against a local table** — `workspace-ops` does
                    not own customers.
                subjectAttributes:
                  type: object
                  description: |
                    Matched against `responsibility_rules.subject_selector`. The caller supplies
                    these **because the caller has the envelope**; `directory` matches on them
                    without ever storing them. Without this field the selector could never be
                    evaluated for a notification.
                excludePersonIds:
                  type: array
                  items:
                    type: string
                  description: |
                    Four-eyes. **A set, not a single id** — *"because three-stage approvals exclude
                    several"* prior actors.
                at:
                  type: string
                  format: date-time
                  description: |
                    Resolve as of a point in time, for replay and audit. **Defaults to now**;
                    a past value re-labels the whole result (DD-directory-10). *"Resolving 'who was
                    responsible last Tuesday' is a compliance question that will be asked. Without
                    it, an audit replay silently uses today's roster."*
              required: [domain, roles, subjectType, subjectRef]
      responses:
        '200':
          description: |
            `ResponsibleDto[]`, ordered by role then priority. Fields from `modules/directory.md` §4:
            `personId`, `displayName`, `role`, `source` (`rule` · `manual_override` · `escalation`),
            and **`ruleId`** — *"every assignment must be able to explain itself. 'The system chose
            this person' is not an acceptable answer during an incident review."* The screen renders
            `ruleId` as mono and copyable and **never omits it**.

            Candidates are filtered on the **effective** flag — `upstream_active AND local_enabled`.
            **An empty array is a valid answer**, not a `404`.

            The screen additionally renders the six-step resolution chain with each step marked
            reached or not, and the `at` value actually used. ⚠️ **Chain step ⑤, the escalation
            target, has no backing column** — the source's own open question 2.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    personId:
                      type: string
                    displayName:
                      type: string
                    role:
                      type: string
                      enum: [primary, backup, observer, approver]
                    source:
                      type: string
                      enum: [rule, manual_override, escalation]
                    ruleId:
                      type: [string, 'null']
                      description: Why this person. Required for auditability; never omitted by the UI.
                  required: [personId, displayName, role, source, ruleId]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  # ───────────────────────────────────────────────────────────────────────────
  # notification
  # ───────────────────────────────────────────────────────────────────────────

  /api/v1/notification/deliveries:
    get:
      tags: [notification]
      operationId: findDeliveries
      summary: Deliveries
      description: |
        **Owned by `modules/notification.md` §5a.1** — the section this contract is generated from.

        `design/screens/notification.md` §1. **RBAC: `notification:delivery:read : category:*`** for
        the list, `category:<category>` for one row — the scope dimension here is the **category**
        (§13.8).

        **Default: `last 24h`, no status filter**, sorted **`created_at` desc** — *"an unbounded
        first query on a month-partitioned table is a slow screen on day one."* The shipped saved
        view `Needs attention` is `status = dead OR no_recipient = true`, the same set the Attention
        screen reads. Page size 50. **Live** — one of the four stream-fed tables; rows fade in at the
        top, nothing reorders, and an open row is never removed even when it falls out of the filter.

        **`no_recipient` is a first-class outcome, not a failure of this module.** ADR-21: a `notify`
        that completed correctly and reached nobody is **not `succeeded`**, and it makes the
        originating event `partial` so it lands in the same work queue as a failed action — *"one
        screen, one story."*

        Columns: severity, `created_at`, category, `subject_ref` / `subject_type`, recipient,
        `channels_effective`, status, `attempt_count`, driver ref (the last two default-hidden).

        ⚠️ **Retry a delivery** (`notification:delivery:retry : category:<category>`) **has no
        endpoint.** Its semantics are stated — the notifier dedupes on `idempotency_key`, so a retry
        that already landed is a no-op, and retrying does **not** re-resolve recipients from
        scratch — but no path exists. Not emitted.
        ⚠️ **`Recompute now`** (DD-notification-08) and **Export** likewise have no endpoint.

        **Adopted — this operation has no client method** (`modules/notification.md` §5a.3). `NotificationClient`
        must gain:

        ```ts
        abstract findDeliveries(q: DeliveryQuery): Promise<Page<DeliveryDto>>;
        ```

        **Adopted because the payload is redacted and encrypted, and a read model has to say so.**
        `deliveries.payload` is redacted at the module boundary against `payload_policies.field_rules` — an
        allow-list where a path is `allow`, `mask`, or by omission dropped — and encrypted under a per-subject
        key (ADR-19, ADR-26). *"A `DeliveryDto` is therefore not a row projection; it is the output of a
        policy this module owns. A controller selecting columns is one refactor away from returning an
        unredacted payload, and the failure is invisible until somebody reads a support ticket."*

        ⚠️ This file previously summarised the gap as **three** paths, the policy ones. **It is five** —
        `modules/notification.md` §5a.3 records the undercount explicitly.
      parameters:
        - name: summary
          in: query
          schema:
            type: string
            enum: ['1']
          description: |
            `?summary=1` — adds the scope-summary counts: `count(*)` over the filter, plus
            `status = dead` and `no_recipient = true`. `design/patterns.md` §4.1 rule 9 requires a
            zero to be **returned, never omitted**: *"a hidden zero is indistinguishable from a
            broken counter."*
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: |
            **Multi-valued**, stated explicitly. This is the only screen in the spike that says its
            filter state lives in the URL query string; the parameter **names** below are the filter
            tokens as written, and no encoding is specified for any of them.
        - name: category
          in: query
          schema:
            type: string
            enum: [incident, assignment, approval, audit]
          description: |
            Platform vocabulary, not a driver detail — `Notifier.send(category, …)` (§6), a column on
            `channel_policies` · `payload_policies` · `deliveries`, a closed union on
            `DispatchNotificationCommand`, an RBAC dimension, and the scope selector for
            `deliveries` (§13.8).
        - name: severity
          in: query
          schema:
            type: string
            enum: [info, warning, critical]
          description: |
            Note this is `notification`'s **own** field, set by the dispatching module. `severity` in
            an **envelope** is forbidden and rejected as `invalid` (§7.2) — it is a decision, not a
            fact, and allowing it would put routing policy back in the publisher's codebase.
        - name: no_recipient
          in: query
          schema:
            type: boolean
        - name: driver
          in: query
          schema:
            type: string
        - name: subject_ref
          in: query
          schema:
            type: string
        - name: recipient
          in: query
          schema:
            type: string
      responses:
        '200':
          description: '⚠️ **Shape UNSPECIFIED** beyond `deliveries.*` and the column list above.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/notification/deliveries/{id}:
    get:
      tags: [notification]
      operationId: getDelivery
      summary: Delivery detail — requested vs effective channels, payload, hand-off
      description: |
        **Owned by `modules/notification.md` §5a.1** — the section this contract is generated from.

        `design/screens/notification.md` §2.
        **RBAC: `notification:delivery:read : category:<category>`.**

        `status`, `attempt_count` and the hand-off block update live with the list. `Trace` and
        `History` **load on expand and never live** — *"`audit` is a compliance store and must not
        become a runtime dependency of an operational screen."*

        Fields: `deliveries.category`, `.severity`, `.status`, `.created_at`, `.handed_off_at`,
        `.channels_requested`, `.channels_effective`, `.payload`, `.driver`, `.driver_ref`,
        `.attempt_count`, `.error`, `.recipient_person_id`, `.correlation_id`, `.causation_id`,
        `.scopes`, `.subject_key_id`; plus `channel_policies.channels`, `.mandatory_channels`,
        `.quiet_hours` for the requested-vs-effective comparison.

        **`.payload` is data, not prose** (`modules/notification.md` §5) — one payload serves every
        channel and every locale; message templates live in the notifier.

        **And data is where the personal data is.** The payload is redacted at the module boundary
        **before both writes** — this table *and* the notifier's own database, *"whose retention this
        platform does not control"* — against `payload_policies.field_rules`, which is an
        **allow-list**: a path is `allow`, `mask`, or by omission **dropped**. There is no
        "everything else is fine" branch. `mask` exists so a template renders a stable token rather
        than a hole.

        **`.subject_key_id` is the crypto-shredding pointer** (ADR-19, ADR-26): the payload is
        encrypted with a per-subject data key, and erasure destroys the key rather than the rows —
        so row structure and count are unchanged and the operational questions still answer.

        **Adopted — this operation has no client method** (`modules/notification.md` §5a.3). `NotificationClient`
        must gain:

        ```ts
        abstract getDelivery(id: string): Promise<DeliveryDto | null>;
        ```

        Note what adopting does **not** license: `DispatchResult` and `DeliveryDto` are different shapes and
        must stay so. *"The first says the hand-off happened; the second says what the notifier did with
        it."*
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '⚠️ **Shape UNSPECIFIED** beyond the field list above.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/notification/policies:
    get:
      tags: [notification]
      operationId: findChannelPolicies
      summary: Channel policies — the category × severity grid
      description: |
        **Owned by `modules/notification.md` §5a.1** — the section this contract is generated from.

        `design/screens/notification.md` §3. **RBAC: `notification:channel_policy:write : *`.**

        **No filters.** *"Twelve rows is the whole set, and a filter over twelve rows hides the shape
        that makes the grid worth being a grid."* **Static**, re-read on save; the Categories section
        below it **polls 60s**, aligned with the sidebar health dot, so a re-seed visibly resolves
        without a reload.

        ⚠️ **No create endpoint exists**, although the screen renders `not configured` with a
        `Create` affordance for a missing row. Only `PUT …/policies/{id}` is named, and a `PUT` to an
        id that does not exist yet cannot be that create. Not emitted.
        ⚠️ **`Re-seed categories`** (`notification:category:seed : *`) has no endpoint. Its semantics
        are stated — it writes into the driver, is idempotent, and does not touch templates — but no
        path exists. Not emitted.

        **Adopted — this operation has no client method** (`modules/notification.md` §5a.3). `NotificationClient`
        must gain:

        ```ts
        abstract findChannelPolicies(): Promise<ChannelPolicyDto[]>;
        ```

        **The policy trio is adopted because authoring and applying a policy are one rule seen twice.**
        Channel resolution reads `channel_policies` to decide what actually goes out; this grid writes it. The
        same constraints govern both — `mandatory_channels ⊆ channels`, quiet hours, digest window — *"and if
        the editor validates in a controller while the resolver validates in `internal/`, the grid can save a
        row the resolver will not honour, and nothing fails at the moment it is saved."*
      responses:
        '200':
          description: '⚠️ **Shape UNSPECIFIED** beyond `channel_policies.*`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/notification/policies/{id}:
    put:
      tags: [notification]
      operationId: saveChannelPolicy
      summary: Save one channel policy row
      description: |
        **Owned by `modules/notification.md` §5a.1** — the section this contract is generated from.

        `design/screens/notification.md` §3. **RBAC: `notification:channel_policy:write : *`.**

        **The one write endpoint in the whole spike whose body fields are enumerated in the same cell
        as its path.**

        Save-time rejection: **`mandatory_channels ⊄ channels`, with the offending channel named** —
        the backend rejects it and the editor mirrors it at the same moment
        (`design/patterns.md` §2 rule 5).

        ⚠️ `active` is *"saved separately and immediately"* (`design/patterns.md` §2 rule 4), which
        implies a second write path that is **not named anywhere**, even though `active` is listed
        among this body's fields.

        **Adopted — this operation has no client method** (`modules/notification.md` §5a.3). `NotificationClient`
        must gain:

        ```ts
        abstract saveChannelPolicy(id: string, cmd: SaveChannelPolicyCommand): Promise<ChannelPolicyDto>;
        ```

        One named method, one validation, one place to change when a channel is added — the alternative is an
        editor that can save a row the resolver will not honour.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: |
          Fields harvested verbatim from the Data table: `channel_policies.category`, `.severity`,
          `.channels`, `.mandatory_channels`, `.quiet_hours`, `.digest_window`, `.active`.
          ⚠️ **Types and encodings are not stated** — the mock renders `digest_window` as `PT30M`
          and quiet hours as `22:00–07:00` with a timezone, which is evidence, not a schema.
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                  enum: [incident, assignment, approval, audit]
                severity:
                  type: string
                  enum: [info, warning, critical]
                channels:
                  type: array
                  items:
                    type: string
                mandatory_channels:
                  type: array
                  items:
                    type: string
                  description: |
                    Must be a subset of `channels`. **Mandatory means the recipient cannot mute it** —
                    which is why removing one is a confirmed action.
                quiet_hours:
                  description: '⚠️ Type not stated. Rendered as `22:00–07:00` with an IANA timezone.'
                digest_window:
                  description: '⚠️ Type not stated. Rendered as an ISO-8601 duration, `PT30M`.'
                active:
                  type: boolean
      responses:
        '200':
          description: ⚠️ **Response shape UNSPECIFIED.**
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/notification/policies/{id}/consequence:
    get:
      tags: [notification]
      operationId: getChannelPolicyConsequence
      summary: Blast radius of a policy change
      description: |
        **Owned by `modules/notification.md` §5a.1** — the section this contract is generated from.

        `design/screens/notification.md` §3. **RBAC: `notification:channel_policy:write : *`.**

        The measured number a policy edit must state before it is saved:
        `count(deliveries) WHERE category, severity, created_at > now() - 7d` — **a 7-day window** —
        plus how many were lost to quiet hours. `design/patterns.md` §6 (DD-08) requires this query
        to **ship with the action**, because *"'this may affect other systems' is ignorable;
        '4,182 events in the last 7 days' is not."*

        **Adopted — this operation has no client method** (`modules/notification.md` §5a.3). `NotificationClient`
        must gain:

        ```ts
        abstract channelPolicyConsequence(id: string): Promise<PolicyConsequence>;
        ```
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            ⚠️ **Response shape UNSPECIFIED.** The screen renders the 7-day usage count, the
            mandatory channels, and a quiet-hours loss count.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ───────────────────────────────────────────────────────────────────────────
  # integration
  # ───────────────────────────────────────────────────────────────────────────

  /api/v1/integration/callbacks/{providerCode}:
    post:
      tags: [integration]
      operationId: receiveProviderCallback
      summary: Inbound provider callback
      description: |
        **Owned by `modules/integration.md` §4a.1** — the section this contract is generated from.

        **`modules/integration.md` §7 — the second of only two paths in this file named above
        `design/`.** `design/screens/integration.md` §0 says so itself: *"Only
        `POST /api/v1/integration/callbacks/{providerCode}` is named in the module doc (§7); every
        other endpoint below is derived from the `/api/v1/integration` prefix."*

        **RBAC: none.** This path is outside §11 — see the security note below.

        The pipeline, from §7:

        | Step | Rule |
        |---|---|
        | Signature | Verified against the provider's key. Invalid → stored in `callbacks` with `signature_valid = false`, answered `401` |
        | Replay window | Timestamp outside the window → rejected and stored |
        | Correlation | Matched to a pending `invocation`; **unmatched callbacks are stored with a rejection reason, never discarded** |
        | Normalisation | `output_mapping` converts the vendor shape into ours |
        | Emission | `integration.invocation.completed` to the outbox → stream → `automation` → `signal_process` |

        **An unverifiable callback is stored and rejected.** *"It is either an attack or a
        misconfiguration, and both are things someone needs to see."* This is the **one place where
        an unauthenticated body is stored** — deliberately, because it is a bounded, rate-limited,
        per-provider endpoint, unlike the open ingress door in `automation`, where storing an
        unauthenticated body would hand an anonymous caller an unbounded write primitive.

        Note the asymmetry with `automation`'s door is intentional and must not be "harmonised".
      security: []
      parameters:
        - name: providerCode
          in: path
          required: true
          schema:
            type: string
          description: |
            The provider whose key verifies the signature. Vendor names live only in
            `integration/internal/connectors/` and `src/seed/` (§10) — the core never learns them.
      requestBody:
        required: true
        description: |
          The vendor's own shape, stored verbatim as `callbacks.body` alongside `callbacks.raw_headers`
          before `output_mapping` normalises it. ⚠️ **Necessarily unspecified** — it is a contract the
          vendor owns, one per provider, and there is no common shape to state.
        content:
          application/json:
            schema: {}
      responses:
        '202':
          description: |
            Accepted, stored, matched to a pending invocation. ⚠️ **Response shape UNSPECIFIED.**
        '401':
          description: |
            Signature invalid, or the timestamp fell outside the replay window. **The body is still
            stored**, with `signature_valid = false` and a rejection reason — the one deliberate
            exception to *"never store the body of a request that failed authentication."*
            `design/patterns.md` §4.2 carries `callbacks.signature_valid = false` as a standing
            security queue: *"a security signal that needs a filter to see is a security signal
            nobody sees."*
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      x-security-note: |
        ⚠️ **`security: []` above does not mean unauthenticated.** This endpoint is authenticated by
        a **per-provider signature over the body**, verified against the provider's key (§7). It is
        not modelled as a `securityScheme` because **no document names the signature header, the
        timestamp header, or the algorithm** — declaring one would be invention of exactly the kind
        §7.1 closed for the stream door when it pinned the field name `envelope`. Settle the header
        names before a provider integrates.

  /api/v1/integration/providers:
    get:
      tags: [integration]
      operationId: findProviders
      summary: Providers
      description: |
        **Owned by `modules/integration.md` §4a.1** — the section this contract is generated from.

        `design/screens/integration.md` §1. **RBAC: `integration:provider:read : *`.**

        **Filters:** `active` · `connector` · `breaker` · `credential expiring`.
        **Default: `active`** — *"an inactive provider is configuration nobody is running against."*
        **Polled 10s** — breaker state and the credential countdown are the only volatile values.

        Credential expiry is surfaced at **`warn` ≤ 14 days, `error` past**, and
        `design/patterns.md` §4.2 carries *credential expiring* as a standing queue condition.

        Columns: `providers.code · name · connector · timeout_ms · active`.

        ⚠️ **No create endpoint exists.** `Add provider` carries `integration:provider:write : *` and
        no path. `Toggle active`, `Reset breaker` and `Test connection` likewise have RBAC and no
        path — the last of these despite the source noting *"a test is a real call and produces a
        real `invocations` row."* Not emitted.
        ⚠️ **No circuit-breaker read endpoint exists**, and the source says so outright (O-3):
        breaker state is *"runtime only — no column, no specified status endpoint… it needs a named
        read endpoint before any of them ships."* Three screens render it live. **Deliberately not
        emitted** — inventing it would paper over a shipping blocker the document raised.

        **No client method, and it must not get one — configuration** (`modules/integration.md` §4a.2).
        Providers, credentials, capability bindings and destinations are served by `internal/http/` over this
        module's own tables. ADR-05 makes `integration` the only holder of provider credentials and the SSRF
        guard: *"a rotation method on `IntegrationClient` would export credential rotation to every module
        that can inject the token, and `automation` deliberately holds no secrets."* `ciphertext` is never
        projected into any response, including through the client.
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: '⚠️ **Shape UNSPECIFIED** beyond the column list above.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/integration/providers/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [integration]
      operationId: getProvider
      summary: One provider
      description: |
        **Owned by `modules/integration.md` §4a.1** — the section this contract is generated from.

        `design/screens/integration.md` §2, harvested from the combined cell
        `GET·PATCH /api/v1/integration/providers/{code}` and expanded into two operations.

        **RBAC: `integration:provider:write : provider:<code>`** is the screen's declared primary;
        the read is `integration:provider:read : *`.

        **Breaker mark polled 10s; every form field static.**

        **No client method, and it must not get one — configuration** (`modules/integration.md` §4a.2).
        Providers, credentials, capability bindings and destinations are served by `internal/http/` over this
        module's own tables. ADR-05 makes `integration` the only holder of provider credentials and the SSRF
        guard: *"a rotation method on `IntegrationClient` would export credential rotation to every module
        that can inject the token, and `automation` deliberately holds no secrets."* `ciphertext` is never
        projected into any response, including through the client.
      responses:
        '200':
          description: '⚠️ **Shape UNSPECIFIED** beyond `providers.*`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [integration]
      operationId: updateProvider
      summary: Update a provider
      description: |
        **Owned by `modules/integration.md` §4a.1** — the section this contract is generated from.

        `design/screens/integration.md` §2 (the `PATCH` half of `GET·PATCH …/providers/{code}`).

        **RBAC: `integration:provider:write : provider:<code>`** — scoped to the single provider.

        **A mandatory per-provider timeout** with a default of 5 s and a **hard ceiling of 15 000 ms**
        (`ARCHITECTURE.md` §15). A timeout counts as a failed attempt. Note the asymmetric rule on
