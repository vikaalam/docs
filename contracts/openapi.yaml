      summary: Open assignment count for one rule
      description: |
        **Owned by `modules/directory.md` §4a.1** — the section this contract is generated from.

        `design/screens/directory.md` §3, written with an elided prefix
        (`GET …/responsibility/[id]/impact`).

        **RBAC: `directory:responsibility:read : domain:<name>`.**

        This is a **blast-radius query**, and `design/patterns.md` §6 (DD-08) makes it mandatory
        rather than decorative: *"the dialog states the blast radius as a measured number, not a
        warning adjective… The query behind that number must ship with the action."* Sourced from
        `responsibility_assignments`.

        **Adopted — this operation has no client method** (`modules/directory.md` §4a.3). `DirectoryClient`
        must gain:

        ```ts
        abstract ruleImpact(ruleId: string): Promise<{ openAssignments: number }>;
        ```

        **It goes on the contract rather than staying inline in a controller** because the number describes
        what the **resolver** will do differently after the edit, so it has to be testable against the
        resolver: *"a `count(*)` written in a controller is a number nobody can hold against the chain in §5
        it is supposed to describe, and the first time the two disagree the dialog will be the thing that is
        wrong."* The count is over `responsibility_assignments`, a table no other module may read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '⚠️ **Response shape UNSPECIFIED.** Described only as an open-assignment count.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
