        **Owned by `modules/reporting.md` §5a.1** — the section this contract is generated from.

        `design/screens/reporting.md` §4, written with an elided prefix
        (`GET …/runs/[id]/reproducibility`).

        **RBAC: `reporting:run:read : domain:<d>`.**

        Backed by `report_runs.{input_watermark,row_count,checksum}` — the columns that let a
        `checksum mismatch` filter exist. For a regulatory filing this is the difference between a
        re-run and a second filing.

        **Adopted — this operation has no client method** (`modules/reporting.md` §5a.3). `ReportingClient`
        must gain:

        ```ts
        abstract runReproducibility(runId: string): Promise<Reproducibility>;
        ```

        **Adopted because it decides re-run versus second filing** — for a regulatory filing that distinction
        is *"the difference between an inconvenience and an incident."* Backed by
        `report_runs.{input_watermark, row_count, checksum}`; it belongs beside `submit` on the contract for
        the same reason `submit` is there.
