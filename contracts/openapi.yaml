  /api/v1/reporting/submissions:
    get:
      tags: [reporting]
      operationId: findReportSubmissions
      summary: Regulatory submissions
      description: |
        **Owned by `modules/reporting.md` §5a.1** — the section this contract is generated from.

        `design/screens/reporting.md` §5. **RBAC: `reporting:submission:read : domain:<d>`.**

        **Filters:** `status:` · `destination:` · `definition:` · period.
        **Default: `status IN (submitted, rejected, dead)`** (DD-reporting-01) — *"the question is
        **what have we claimed that nobody has confirmed**; an unfiltered list of acknowledged
        filings answers a question nobody arrived with."* Attempts column hidden by default.
        **Polled 30s** — an acknowledgement returns through
        `integration` → `automation` → `signal_process` → `recordSubmissionResult`.

        **`submitted` is in the default set on purpose**: *"'we sent it' and 'they have it' are
        different claims, and only one survives an audit"* (`design/patterns.md` §4.2).

        Columns: `report_submissions.{status,submitted_at,acknowledged_at,attempt_count}`,
        `.{destination_code,receipt,error}`, `.invocation_id`, `.report_run_id`.

        **At-most-once is achieved locally, never by trusting the far side.** `ARCHITECTURE.md` §15
        and `modules/integration.md` §4: the `Idempotency-Key` header is best-effort against a
        contract we do not control, so for a filing the caller **marks its own intent before the
        call and reconciles afterwards** (§21 · B8).

        ⚠️ **`Retry` (`dead` only) and `Re-file` (`rejected` only) have no endpoints**, despite
        `reporting:submission:retry : domain:<d>`.
        ⚠️ **`Mark acknowledged` is an explicit negative — *"Does not exist"*** — and must not be
        added.

        **Adopted — this operation has no client method** (`modules/reporting.md` §5a.3). `ReportingClient`
        must gain:

        ```ts
        abstract findSubmissions(q: SubmissionQuery): Promise<Page<SubmissionDto>>;
        ```

        **This one matters most.** `submit()` and `recordSubmissionResult()` are both on the contract and the
        read that **reconciles them** is not — *"yet §8's whole rule is mark your own intent before the call
        and reconcile afterwards, because at-most-once is achieved locally or not at all. Leaving the
        reconciliation query in a controller puts the most consequential read in this module somewhere no test
        of §8 will find it."*
      responses:
        '200':
          description: '⚠️ **Shape UNSPECIFIED** beyond the column list above.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  # ───────────────────────────────────────────────────────────────────────────
  # audit
  #
  # A read-only module by specification, not by omission: `modules/audit.md` §5's
  # AuditClient declares query · timeline · forResource · export · verifySeals and
  # NO write method. `design/app-shell.md` §5 — "that absence is a specification,
  # not an oversight." Audit entries are written by a capability inside the caller's
  # transaction (ADR-07), never over HTTP.
  #
  # Never put audit on a hot path: nothing polls, nothing streams, History loads on
  # expand. Every other module's detail screen embeds forResource() rather than
  # keeping its own history panel.
  # ───────────────────────────────────────────────────────────────────────────

  /api/v1/audit/entries:
    get:
      tags: [audit]
      operationId: queryAuditEntries
      summary: Audit search
      description: |
        **Owned by `modules/audit.md` §5a.1** — the section this contract is generated from.

        `design/screens/audit.md` §1 · `modules/audit.md` §5 (`AuditClient.query`).

        **RBAC: `audit:entry:read:module:<name>`** — read scope is the **module** dimension,
        mirroring §11's first guard; `audit:entry:read:*` is separately granted. ⚠️ Note this file
        uses the **unspaced** RBAC grammar while `automation` and `directory` use the spaced form,
        and `design/screens/audit.md` itself reverts to the spaced form for
        `audit:legal_hold:read : *`. Same permission language, two spellings, one file.

        **Default: `last 7 days` + `outcome: any`** — *"an unbounded first query on a
        monthly-partitioned table is a slow screen on day one."* **`outcome: any` renders as an
        explicit chip, never an unstated default** (DD-audit-03): *"a screenshot of this table has to
        prove `rejected` was not hidden."* Page size 50.

        **Static. No stream, no poll** — *"`audit` is a compliance store and must never be on a hot
        path, and a screen that polls it makes it one."* The topbar shows `⟳ not live`.

        Fields: `audit_entries.occurred_at`, `.actor_type`, `.actor_ref`, `.actor_display`,
        `.module`, `.resource_type`, `.resource_id`, `.action`, `.outcome`, `.changed_fields`,
        `.before`, `.after`, `.rejection_reason`, `.ip`, `.user_agent`, `.request_id`,
        `.correlation_id`, `.trace_id`, `.subject_key_id`.

        `outcome` is `applied` or `rejected`. Free text runs **`ILIKE`, never `LIKE`** over
        `actor_display`, `resource_id`, `resource_type` — PostgreSQL is case-sensitive where MySQL's
        default collation is not, and `LIKE` *"silently returns nothing for a correctly-typed name in
        the wrong case."*
      parameters:
        - name: countOnly
          in: query
          schema:
            type: boolean
          description: |
            `?countOnly=true` — `count(audit_entries)` under the current scope. Drives the export
            screen's row count and **disables `Export` until it resolves**; above the stated row cap
            the count renders `warn` and `Export` stays enabled. ⚠️ The cap value is never stated.
        - name: action
          in: query
          schema:
            type: string
            enum: [create, update, delete, transition, grant, revoke, export, access, submit, cancel]
          description: |
            `?action=export` is used by the export screen to show *"the record of this export"* —
            because **exporting is itself an audited action**: *"an audit log that does not record
            who read it is only half a control."*
        - name: actor
          in: query
          schema:
            type: string
          description: Filter chip; wire encoding not stated.
        - name: module
          in: query
          schema:
            type: string
          description: Filter chip; wire encoding not stated. Also the RBAC read-scope dimension.
        - name: outcome
          in: query
          schema:
            type: string
            enum: [applied, rejected]
          description: 'Default `any`, rendered as an explicit chip. ⚠️ Wire encoding of "any" not stated.'
      responses:
        '200':
          description: '`Page<AuditEntryDto>`. ⚠️ **Shape UNSPECIFIED** beyond the field list above.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/audit/timeline/{correlationId}:
    get:
      tags: [audit]
      operationId: getAuditTimeline
      summary: The full cross-module thread for one case
      description: |
        **Owned by `modules/audit.md` §5a.1** — the section this contract is generated from.

        `design/screens/audit.md` §2 · `modules/audit.md` §5 (`AuditClient.timeline`).
        Linked from `task`, `notification`, `integration` and `automation` detail screens — the most
        widely referenced endpoint in the spike.

        **RBAC: `audit:entry:read:*`** — the trace crosses modules, so a module-scoped grant cannot
        serve it.

        *"The most valuable query in the platform: one identifier ties the originating event, the
        process instance, every task, every provider invocation, every notification, and the filed
        report into a single ordered list. That is what makes an incident review a query instead of
        an archaeology project."*

        **The screen composes; this endpoint does not.** The `INGEST` half of a trace comes from a
        **second query** the screen issues against
        `GET /api/v1/automation/events?correlationId=` — *"giving `timeline()` that read would hand
        `audit` a cross-schema dependency."* The store-label gutter is therefore exactly two values,
        `AUDIT` and `INGEST`, and that is the complete vocabulary.

        **Gap collapsing is relative, not a constant**: a gap exceeding **5% of the trace's total
        span, with a 60s floor**, and the filter chip states the effective threshold
        (`gaps > 7m collapsed`) rather than the constant. Module chips **default to all**, and
        filtering hides rows but **never renumbers the header count**, which always states the full
        trace size. **Static** — *"a trace is read after the fact."*
      parameters:
        - $ref: '#/components/parameters/CorrelationIdPath'
      responses:
        '200':
          description: '`AuditEntryDto[]`, ordered. ⚠️ **Shape UNSPECIFIED.**'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/audit/resource/{type}/{id}:
    get:
      tags: [audit]
      operationId: getAuditResourceHistory
      summary: Everything that ever happened to one resource
      description: |
        **Owned by `modules/audit.md` §5a.1** — the section this contract is generated from.

        `design/screens/audit.md` §3 · `modules/audit.md` §5 (`AuditClient.forResource`).

        **This is the single most reused operation in the product.** *"Every other module's detail
        screen embeds `forResource()` rather than keeping its own history panel"* — except `task`,
        which additionally keeps `task_state_changes` for SLA arithmetic. Called across the spike
        for `event_type`, `subject_type`, `workflow`, `publisher`, `provider`, `channel_policy`,
        `task`, `task_type`, `responsibility_rule`, `report_definition`, `report_run`,
        `process_definition_version`, `process_instance`, `person` and `legal_hold`.

        **RBAC: `audit:entry:read:module:<name>`.**

        **Filters:** `action`, `actor`, `date range`. **No `outcome` filter by default** — *"the
        `rejected` rows are why this screen is opened as often as it is: a rejected save is how a
        priority collision gets explained months later."* **Static**, and loaded **on expand only**
        wherever it is embedded.

        ⚠️ Four of its callers (`design/screens/automation.md`) name this path **without a method**,
        and two (`design/screens/reporting.md`, `design/screens/directory.md`) write it with the
        resource segment elided as `…`. `GET` is taken from `design/screens/audit.md`, which owns it.
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
          description: The resource type, e.g. `workflow`, `provider`, `channel_policy`, `legal_hold`.
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '`AuditEntryDto[]`. ⚠️ **Shape UNSPECIFIED.**'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/audit/export:
    post:
      tags: [audit]
      operationId: exportAuditEntries
      summary: Export a scoped set of audit entries to an artifact
      description: |
        **Owned by `modules/audit.md` §5a.1** — the section this contract is generated from.

        `design/screens/audit.md` §4 · `modules/audit.md` §5 (`AuditClient.export`).

        **RBAC: `audit:entry:export:*`** — global, and separate from `read`.

        **Exporting is itself an audited action** (`modules/audit.md` §5): *"an audit log that does
        not record who read it is only half a control."* The confirmation must say so, and the
        response links to the audit entry the export produced. **Redacted fields stay redacted in
        the export.**

        The scope is *"the §1 query, unchanged"*, carried in from the invoking screen —
        ⚠️ **and that Data row's endpoint cell is literally `—`**, so how the scope reaches this
        endpoint is unspecified.
      requestBody:
        required: true
        description: |
          ⚠️ **Request body UNSPECIFIED as fields.** Inferable from the form: `actor`, `module`,
          `action`, `outcome`, a `range` with a timezone, and a **`format` of `CSV` or `JSONL`** —
          the one enumerated value. **The source raises its own open question**: *"whether
          `AuditExportCommand` carries a stated **reason** is not specified in `audit.md` §5… the
          form has no `Reason` input until the command declares it."*
        content:
          application/json:
            schema: {}
      responses:
        '202':
          description: |
            `ArtifactRef`. ⚠️ **Shape UNSPECIFIED as fields**, though the screen requires it to carry
            a **checksum and a size**, plus a link to the audit entry this export produced.
        '400':
