        **Owned by `modules/directory.md` §4a.1** — the section this contract is generated from.

        `design/screens/directory.md` §1. **RBAC: `directory:person:read : *`** — the roster is not
        domain-scoped, because *"a compliance configurator must not edit treasury routing, but the
        roster is one roster."*

        **Filters:** `active` · `team` · `upstream: deactivated` · `drift` · `no contact handle`.
        **Default: `active`** — *"the roster holds everyone the IdP ever emitted; opening on all of
        them makes this a personnel archive rather than a routing tool."*

        **Static.** Loaded on navigation, refreshed on save: *"the projection changes when the IdP
        emits and when the daily sweep runs; a refresh indicator would imply a freshness the data
        lacks, so `projected_at` carries it as a column instead."*

        **This is a projection of the IdP, not a roster this platform owns** (§11.1,
        `modules/directory.md`) — which is why *"a person deactivated upstream stops receiving work
        here with no manual step."*

        **Two flags, one answer:** effectiveness is `upstream_active AND local_enabled`, and both
        sides are rendered so a reader can see which produced the result.

        ⚠️ **No create endpoint exists, by design.** *"People appear when the identity provider emits
        them, not when someone adds them here. No create action."*
        ⚠️ **No write endpoint exists for the two edits that are permitted** — `Set inactive` /
        `Set active` (`persons.local_enabled`) and `Edit timezone / contact`, both
        `directory:person:write : *`, both pathless. Not emitted.
        ⚠️ **A hard prohibition to enforce on whatever write is eventually specified:** *"No control
        here writes a projected column. `email`, `display_name`, `job_title`, `teams.code`,
        `teams.name`, and `team_members` rows have no editor, no inline edit, and no 'override
        locally' escape."* The projection handler applies a column allowlist; an unknown key is a
        **rejection, not a silent skip** (`modules/directory.md` §4).
