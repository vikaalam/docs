  /api/v1/reporting/fact-types:
    get:
      tags: [reporting]
      operationId: findFactTypes
      summary: Fact types — counts, newest, and lag per type
      description: |
        **Owned by `modules/reporting.md` §5a.1** — the section this contract is generated from.

        `design/screens/reporting.md` §2, §3. **RBAC: `reporting:fact:read : *`** — fact types are
        global, not domain-scoped.

        **Filters:** `declared but empty` · `used by a definition` · `unused`. **Default: none** —
        six rows. **Polled 30s** — *"lag is the only number here that means anything."*

        Derived from `report_facts.{fact_type,recorded_at,occurred_at}`, aggregated —
        `max(report_facts.recorded_at)` per `fact_type` is the lag.

        Facts arrive through the **`project` action** (`modules/automation.md` §4), which reaches
        `ReportingProjectionClient.recordFact`, **idempotent by `(factType, sourceEventId)`**.
        `occurredAt` on a `RecordFactCommand` is **the source event's `occurredAt`, not `now()`** —
        the same rule `directory`'s projection carries, and the reason §7.5 makes `occurredAt`
        required on the envelope: *"arrival time is the time the pipeline was healthy, not the time
        the thing happened."*

        ⚠️ **`Backfill / replay`** (`reporting:fact:backfill : *`) **has no endpoint**, and the
        source flags a deeper gap: *"backfill runs have no persistence… §3 has no table for its
        range, status, or progress."* Its dialog reads `GET /api/v1/automation/events/count` for the
        envelopes-in-range figure. Not emitted.

        **Adopted — this operation has no client method** (`modules/reporting.md` §5a.3). `ReportingClient`
        must gain:

        ```ts
        abstract findFactTypes(): Promise<FactTypeStatus[]>;
        ```

        **Adopted because the lag figure is a precondition of `run()`** — *"they decide whether the report can
        be run at all, and a stale number there is worse than no number."* `run()` is on the contract; the
        answer to *may I call it yet* should not be reachable only through a screen.
      responses:
        '200':
          description: ⚠️ **Response shape UNSPECIFIED.**
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/reporting/runs:
    get:
      tags: [reporting]
      operationId: findReportRuns
      summary: Report runs
      description: |
        **Owned by `modules/reporting.md` §5a.1** — the section this contract is generated from.

        `design/screens/reporting.md` §4. **RBAC: `reporting:run:read : domain:<d>`.**

        **Filters:** `status:` · period · `definition:` · `trigger_kind:` · `checksum mismatch`.
        **Default: last 30 days, all statuses** — *"unbounded on a monthly-partitioned table is a
        slow screen on day one."* Watermark and checksum columns are **hidden by default**.
        **Polled 10s while any run on the page is `pending` or `running`, static otherwise** —
        *"generation runs in a worker and returns as `reporting.run.completed`; there is no socket
        channel to be live on."*

        Columns: `report_runs.{status,started_at,ended_at,error}`, `.definition_version_id`,
        `.{parameters,period_start,period_end,triggered_by,trigger_kind}`,
        `.{input_watermark,row_count,checksum}`.

        **`run()` returns a reference, and the reference is not a result** (`modules/reporting.md`
        §5): *"a caller that treats `ReportRunRef` as 'the report is ready' has built a poll loop
        against a promise nobody made."* A process step that asks for a report parks and waits for
        `reporting.run.completed`.

        ⚠️ **`Run report`, `Re-run`, `Submit` and `Download artifact` have no endpoints**, despite
        `reporting:run:trigger : domain:<d>`, `reporting:submission:write : domain:<d>` and
        `reporting:artifact:download : domain:<d>`. The run dialog visibly needs `period_start`,
        `period_end` and `parameters` in a body that is never specified. Not emitted.

        **Adopted — this operation has no client method** (`modules/reporting.md` §5a.3). `ReportingClient`
        must gain:

        ```ts
        abstract findRuns(q: RunQuery): Promise<Page<ReportRunDto>>;
        ```

        **This closes an asymmetry, not a feature gap**: `getRun` already returns `ReportRunDto` on the
        contract, and *"a list of the same DTO reachable only through a controller is an oversight rather than
        a decision."*
      responses:
        '200':
          description: '⚠️ **Shape UNSPECIFIED** beyond the column list above.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

