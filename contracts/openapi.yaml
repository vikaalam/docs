  /api/v1/directory/responsibility:
    get:
      tags: [directory]
      operationId: findResponsibilityRules
      summary: Responsibility rules
      description: |
        **Owned by `modules/directory.md` §4a.1** — the section this contract is generated from.

        `design/screens/directory.md` §2, §3.

        **RBAC: `directory:responsibility:read : domain:<name>`** for the read;
        `directory:responsibility:write : domain:<name>` for the edits. This resource **is**
        domain-scoped where `person` and `team` are `*`.

        **Filters:** `domain` · `role` (from `responsibility_roles` — **not a fixed list**) ·
        `active` · `target` · `effective now`.
        **Default: `active` and `effective now`** — *"a table interleaving expired rules with live
        ones is one nobody can read the chain from."* **Static.**

        **The ordering is the resolution chain, not a sort choice**: *"a rule's position is derived
        from which of its two selector columns are null, so the list orders itself the way the
        resolver reads it."* Within a group, selector rules are matched first by ascending priority;
        `priority` is **lower wins and unique within its group**, and a collision is
        **rejected at save time, not at resolution time** (`modules/directory.md` §8).

        Columns: `responsibility_rules.priority`, `.subject_selector`, `.subject_type`,
        `.target_kind`, `.target_ref`, `.effective_from`, `.effective_to`, plus `domain` and `role`.

        ⚠️ **No write endpoint exists.** `Add rule`, `Save rule`, `Toggle active` (*"saved separately
        and immediately"*, so a distinct write) and `Close the window` (which sets `effective_to`)
        all carry `directory:responsibility:write : domain:<name>` and no path. Not emitted.
