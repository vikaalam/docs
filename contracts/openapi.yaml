  /api/v1/reporting/runs/{id}/artifact:
    get:
      tags: [reporting]
      operationId: getReportRunArtifact
      summary: Artifact metadata for one run
      description: |
        **Owned by `modules/reporting.md` §5a.1** — the section this contract is generated from.

        `design/screens/reporting.md` §4, written with an elided prefix (`GET …/runs/[id]/artifact`).
        Sourced as *"`ArtifactStore`, via `report_runs.artifact_id`"*.

        **RBAC: `reporting:artifact:download : domain:<d>`.**

        **This is metadata, not the bytes.** The download itself is *"a signed link, valid 5 minutes.
        Issuing it is recorded in the audit log"* — **never a permanent URL** — and ⚠️ **the
        link-issuing endpoint is not named anywhere.** Compare
        `POST /api/v1/task/tasks/{id}/attachments/{aid}/download`, which is the same idea with a
        path.

        ⚠️ The source's own open question 4: **size, media type and legal-hold state are not
        `reporting` columns**, so what this endpoint can actually return is unsettled.

        **Adopted — this operation has no client method** (`modules/reporting.md` §5a.3). `ReportingClient`
        must gain:

        ```ts
        abstract getRunArtifact(runId: string): Promise<ArtifactMetadata>;
        ```

        ⚠️ **Adopted with a caveat, and the caveat is the finding.** Size, media type and legal-hold state
        are **not `reporting` columns**, so what this endpoint can return is unsettled. Worse, **the operation
        that issues the download is named nowhere**: the spec says *"a signed link, valid 5 minutes; issuing
        it is recorded in the audit log; never a permanent URL"* and gives it no path, while `task` has
        exactly that operation with exactly that shape
        (`POST /api/v1/task/tasks/{id}/attachments/{aid}/download`). **Adopting the metadata read does not
        create the issuer**, and until `design/screens/reporting.md` §4 names it — modelled on `task`'s —
        `reporting:artifact:download : domain:<d>` is a permission guarding nothing.
      parameters:
        - name: id
          in: path
          required: true
          schema:
