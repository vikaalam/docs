        private-CIDR block, redirects not followed, and a separate global RBAC resource. The screen
        renders the outcome as a resolved address and a public/private verdict
        (`● resolves to 203.0.113.44 · public`).

        **Adopted — this operation has no client method** (`modules/integration.md` §4a.3).
        `IntegrationClient` must gain:

        ```ts
        abstract resolveDestination(baseUrl: string): Promise<UrlGuardVerdict>;
        ```

        **The point of the method is that it is the same call `internal/egress/` makes, exposed rather than
        copied.** The alternative is the editor doing its own DNS lookup and CIDR comparison — *"a second
        implementation of the one control that decides whether this platform can be pointed at the internal
        network, and two implementations of a security control drift in the direction of the one nobody
        reviews."*
