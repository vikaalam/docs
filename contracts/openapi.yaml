        **Owned by `modules/reporting.md` §5a.1** — the section this contract is generated from.

        `design/screens/reporting.md` §2. Written in the source with square brackets
        (`/api/v1/reporting/definitions/[code]/versions/[v]`) — normalised to OpenAPI's `{}` here,
        which is the only mechanical change made to any path in this file.

        **RBAC: `reporting:definition:write : domain:<d>`** is the screen's primary;
        `reporting:definition:publish : domain:<d>` is a separate action.

        **Filters: none. Static**, except the lag figures beside each source fact type, which are
        **polled 30s** — *"they decide whether the report can be run at all, and a stale number there
