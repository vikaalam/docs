        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/process/definitions/{code}/versions/{v}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      - name: v
        in: path
        required: true
        schema:
          type: string
        description: |
          The version. A definition code resolves to the **latest published version at start time**
          (`modules/process.md` §5); a running instance stays pinned to the version it started on.
    get:
      tags: [process]
      operationId: getProcessDefinitionVersion
      summary: One definition version — spec, steps, publication state
      description: |
        **Owned by `modules/process.md` §5a.1** — the section this contract is generated from.

        `design/screens/process.md` §4. **RBAC: `process:definition:read : domain:<domain>`.**

        **Static.** *"Two people editing one draft is a conflict to reject on save, not a state to
        stream."*

        Backing columns: `process_definition_versions.spec`; `process_definitions.code`, `.name`,
        `.domain`, `.description`, `.active`.

        The `spec` sub-structure is the closest thing to a body contract in the spike: a step `kind`
        of `automatic` · `human` · `wait` · `decision` · `parallel`; `capability`; `target`
        (on `automatic`, one of `integration` · `reporting` · `notification`); `mode` sync/async;
        `signalCode`; `when`; `goto`; four-eyes; `parallel.branches`; `decision.branches`; a join
        rule of `all | any`; and `onFailure` / `onExpiry` of `fail` · `skip` · `escalate` ·
        `goto:<stepCode>`.

        **`stepCode`, not `stepId`** (`modules/process.md` §5): the code is stable across a version
        and is what an operator reads; the uuid is internal. Using different types on the outbound
        and inbound legs *"makes the one path that must never fail depend on a conversion nobody
        owns."*
      responses:
        '200':
          description: ⚠️ **Response shape UNSPECIFIED** beyond the `spec` vocabulary above.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [process]
      operationId: saveProcessDefinitionDraft
      summary: Save a draft version
      description: |
        **Owned by `modules/process.md` §5a.1** — the section this contract is generated from.

        `design/screens/process.md` §4, written with an elided prefix (`PUT .../versions/{v}`).

        **RBAC: `process:definition:update : domain:<domain>`.**

        **Drafts only.** `design/patterns.md` §5 rule 3: *"editing a published version is
        impossible, not disabled"* — the affordance offered instead is `Create draft from v3`. A
        superseded version with zero running instances is **still not deletable**; retention is a
        policy decision, not a UI action. **No `DELETE` exists on this path and none should be
        added** — `design/screens/process.md` §4 marks *Delete a version* as *"Does not exist."*

        Concurrency: two people editing one draft is *"a conflict to reject on save"*, so this
        operation needs a conflict response — ⚠️ no mechanism (ETag, version column, `If-Match`) is
        specified anywhere.

        **No client method, and it must not get one — configuration** (`modules/process.md` §5a.2). Served
        by `internal/http/` over this module's own tables. *"Nothing outside `process` reads a definition:
        `StartProcessCommand` carries a `definitionCode`, which this module resolves to the latest published
        version internally. A client method for the version editor would export draft-publishing to every
        module that can inject the token, for no caller."*
      requestBody:
        required: true
        description: |
          ⚠️ **Request body UNSPECIFIED as a wire shape**, though its *contents* are enumerable:
          `process_definition_versions.spec` plus the definition fields `code`, `name`, `domain`,
          `description`, `active`. The validation rules in `design/screens/process.md` §4 are the
          nearest thing to a schema.
        content:
          application/json:
            schema: {}
      responses:
        '200':
          description: ⚠️ **Response shape UNSPECIFIED.**
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Concurrent edit of one draft — *"a conflict to reject on save"*. ⚠️ The detection
            mechanism is unspecified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

