        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/process/instances/{id}/cancel:
    post:
      tags: [process]
      operationId: cancelProcessInstance
      summary: Cancel a running case
      description: |
        **Owned by `modules/process.md` §5a.1** — the section this contract is generated from.

        `design/screens/process.md` §2 · `modules/process.md` §5
        (`ProcessClient.cancel(instanceId, reason, actor)`).

        **RBAC: `process:instance:cancel : domain:<domain>`.**

        **Cancel is the only write offered on a running instance** (DD-process-08). No *send signal*,
        no *skip step*, no *retry step*, no *force complete*, and **no undo**. Do not add them.

        The confirmation is type-to-confirm the `subject_ref`, and `design/patterns.md` §6 requires
        it to state which open tasks will be cancelled with the case, and that nobody is
        un-notified. Cancellation is **not** completion: `modules/task.md` §5 — *"it produces no
        outcome and satisfies nothing."*

        ⚠️ **A recorded contradiction**: `design/screens/process.md` OQ-2 notes that the client
        signature takes a `reason`, but **`process_instances` has no `cancel_reason` and no
        `ended_by` column** — so the reason this endpoint accepts currently has nowhere to land.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: |
          ⚠️ **Request body UNSPECIFIED as a wire shape.** The client signature implies `reason` and
          `actor`; no field names, types or nullability are stated, and see the missing-column
          contradiction above.
        content:
          application/json:
            schema: {}
      responses:
        '200':
          description: ⚠️ **Response shape UNSPECIFIED.**
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/process/definitions:
    get:
      tags: [process]
      operationId: findProcessDefinitions
      summary: Process definitions
      description: |
        **Owned by `modules/process.md` §5a.1** — the section this contract is generated from.

        `design/screens/process.md` §3. **RBAC: `process:definition:read : domain:<domain>`.**

        **Filters:** `active` · `domain` · `has draft` · `has running instances`.
        **Default: `active`. Static** — *"configuration changes when a person changes it; no refresh
        control is shown."*

        ⚠️ **No create endpoint exists.** `New draft (new definition)` carries
        `process:definition:create : domain:<domain>` and no path. Neither does
        `Activate / deactivate definition` (`process:definition:update`).

        **No client method, and it must not get one — configuration** (`modules/process.md` §5a.2). Served
        by `internal/http/` over this module's own tables. *"Nothing outside `process` reads a definition:
        `StartProcessCommand` carries a `definitionCode`, which this module resolves to the latest published
        version internally. A client method for the version editor would export draft-publishing to every
        module that can inject the token, for no caller."*
      parameters:
        - name: capability
          in: query
          schema:
            type: string
          description: |
            Named in `design/screens/integration.md` §3, which asks *"which process definitions
            reference this capability?"* — the logical capability name (`identity.verify`,
            `screening.sanctions`), never a vendor name (`ARCHITECTURE.md` §10). The source adds
            *"and siblings"* for the `automation` and `reporting` equivalents without naming them.
        - name: taskType
          in: query
          schema:
            type: string
          description: |
            Named in `design/screens/task.md` §4 — which process definitions name this task type
            code. Note this is a `stepCode`-style string, not a uuid.
        - name: active
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: ⚠️ **Response shape UNSPECIFIED.**
        '401':
