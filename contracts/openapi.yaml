        exist and must not be added"*.

        Two save-time rejections apply here and belong in a `400`: a `UNIQUE (event_type_id,
        priority)` collision — *"a configuration error, rejected on save"*, with the colliding
        workflow named — and an `observe` or `suppress` workflow that has actions, which is refused
        because *"a disposition that disagrees with its own action list is a configuration whose
        behaviour nobody can predict from reading it"* (`modules/automation.md` §9 rule 13).
