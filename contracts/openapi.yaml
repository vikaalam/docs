openapi: 3.1.0

info:
  title: workspace-ops HTTP API
  version: 0.1.0-draft
  summary: >-
    Generated from the `§5a`/`§4a` HTTP surface sections of `modules/*.md`, which own this contract.
  description: |
    **This file is generated from `modules/*.md`, and it is output rather than source.** Every path,
    method, parameter, default, poll interval and RBAC string below is taken from a module document's
    **HTTP surface** section — `§5a` in `automation` · `process` · `task` · `notification` ·
    `reporting` · `audit`, and `§4a` in `directory` · `integration`. Nothing was invented to fill a
    gap; where a document names an operation but never describes its body, the operation is emitted
    with an explicit `UNSPECIFIED` note rather than a plausible schema.

    **If this file and a module's `§5a`/`§4a` section disagree, this file is stale and the module is
    right.** The module document is rank 2 in `CLAUDE.md`'s source-of-truth chain; this contract is
    downstream of it. Regenerate rather than patch, and never edit a module section to match a path
    that only exists here.

    ## Provenance — settled 2026-07-28

    This file was previously a **harvest from `design/screens/*.md`**, and its own header said so.
    That was accurate and it was the defect: `design/open-questions.md` **G-05** measured **79 of 81
    paths** as existing only in `design/`, meaning the operator API was being decided by the
    lowest-ranked document in the folder. G-05 was answered on 2026-07-28 (Q1 = A): **each
    `modules/*.md` owns its HTTP surface.** Eight new sections were written, every operation
    attributed with method · path · RBAC · the client method behind it, and the direction of the
    dependency reversed. Screens now render this contract; they no longer define it.

    Only **two** paths were named above `design/` before that ruling, and both are still named there:

    - `POST /api/v1/automation/events/{eventTypeCode}` — `ARCHITECTURE.md` §7.1, echoed as
      `POST /automation/events/{code}` in `modules/automation.md` §7.11.
    - `POST /api/v1/integration/callbacks/{providerCode}` — `modules/integration.md` §7.

    Every other path is now named by its owning module document. Where a module section records a
    disagreement with `design/` rather than resolving it — `people` vs `persons`,
    `PATCH …/destinations` with no `{code}` — this file follows **the module**, and the description
    on that operation says so.

    ## What the ruling changed in this file

    - **One operation was rejected and is no longer emitted.**
      `GET /api/v1/task/tasks/{id}/transitions` — `modules/task.md` §5a.3. The legal-target set is a
      property of *one task read by one actor*, which `GET /tasks/{id}` already is; a second `GET`
      costs a round trip whose answer can disagree with the response that drew the screen. **The
      `POST` half stays**, including returning the legal targets on a `400`.
    - **`audit` grew from 8 operations to 13** (`modules/audit.md` §5a.1). Legal-hold **place** and
      **release** now have paths, and three erasure operations were added the same day the table
      `audit.erasure_requests` was (`modules/audit.md` §3, §4, §5a.5). This file previously said
      *"Place hold and Release hold have no endpoints… Not emitted"* — that is no longer true.
    - **Thirty operations carry an adopted client method.** G-05 counted **26** with no client
      method at the time of the ruling and adopted every one of them; `audit`'s five new operations
      brought the figure to 30. Each such operation's description names the exact method its module
      must gain. That naming is the difference between an endpoint that is specified and one that is
      merely drawn.
    - **Five `platform` paths are owned by no module and are tagged `platform`.** See below.

    ## The five paths no module owns

    `/api/v1/platform/subject-keys`, `POST …/subject-keys/destroy`, `/api/v1/health/capabilities`,
    `/health/live` and `/health/ready` are **not owned by any of the eight modules** in
    `ARCHITECTURE.md` §4. `modules/audit.md` §5a.1 and `modules/notification.md` §5a.1 each record
    the ones that render on their screens as *adjacent but not owned*, precisely so their absence
    from a module table is not read as an omission.

    They are kept, tagged `platform`, and each one's description says no module owns it. The
    unresolved consequence is `design/open-questions.md` **G-06**: §11 derives `module:<name>:access`
    from the route prefix, and there is no `platform` module to derive. Either those routes belong to
    `audit`, or `platform` needs a guard rule of its own. Not decided here — this file is output.

    ## What is deliberately absent

    - **Pagination parameter names.** No document in this spike names a `page`, `limit`, `offset`,
      `cursor` or `pageSize` parameter. The only evidence is a rendered footer, `1–50 of 1,284`
      (`design/patterns.md` §1), which fixes a page size of **50** and nothing else. Emitting a
      parameter name here would be invention, so list operations carry the page size as prose in
      their description and no pagination parameter. `limit` appears exactly once as a literal
      (`GET /api/v1/integration/invocations?provider={code}&limit=1`) and is emitted only there.
    - **Response schemas.** `design/screens/*.md` "Data" tables name the *columns* behind each
      cell, not a wire shape. Those column lists are reproduced in each operation's description;
      they are not restated as `components/schemas`, because a column list is not a response body.
    - **Request bodies.** Enumerated for exactly three operations across the whole spike
      (`PUT /api/v1/notification/policies/{id}`, `PUT /api/v1/task/types/{code}`,
      `POST /api/v1/directory/responsibility/resolve`). Every other write says so.
    - **Write endpoints for most configuration** — and every module section now records its own
      absences rather than leaving them to `design/`. `automation`'s event types, subject types,
      record types, workflows and stream subscriptions have `Save` / `Delete` / `Activate` actions
      with RBAC strings and **no path anywhere**; `reporting` has **nine reads and zero writes**
      against thirteen mutating actions (`modules/reporting.md` §5a); `directory`'s **every
      permitted write is pathless** (§4a.4); `integration` lacks `Add provider`, `Reset breaker`,
      `Test connection`, `Bind a provider`, `Retry` (§4a.4); `task` lacks bulk claim, `Add comment`
      and `Attach a file` (§5a.2); `notification` lacks `Re-seed categories`, `Retry a delivery`,
      `Recompute now` and `Export` (§5a.4). None are emitted. Inventing them here *"would paper over
      a blocker `design/` raised about itself"* (`modules/integration.md` §4a.4).
    - **A circuit-breaker read endpoint.** `modules/integration.md` §4a.4 calls this one of **two
      shipping-blocking absences** it records and does not fill: `design/screens/integration.md` O-3
      states outright that breaker state is runtime-only with *"no column, no specified status
      endpoint"*, while **three screens render it live**. Not emitted — it does not exist.
    - **The `reporting` artifact-download issuer.** `modules/reporting.md` §5a.3: the operation is
      *"named nowhere"* though its semantics are fully specified (a signed link, valid 5 minutes,
      audited, never permanent). Until it exists, `reporting:artifact:download : domain:<d>` guards
      nothing. `task`'s `POST …/attachments/{aid}/download` is the model it should be built on and
      **is** emitted.
    - **`POST /api/v1/notification/policies`.** `design/screens/notification.md` renders a `Create`
      affordance for a missing policy row, but only `PUT …/policies/{id}` is named. Not emitted.

    ## Two spellings of one thing — now settled by the owning module

    Two collisions survive in `design/`, and `modules/directory.md` §4a.1 rules on both: *"the owning
    document wins, and that is this file."*

    | Collision | Emitted | Also written as |
    |---|---|---|
    | `directory` person collection | `people` — `modules/directory.md` §4a.1, matching both the module and the UI route `/directory/people` | `persons` (`design/screens/task.md`; the table is `persons`, almost certainly the origin of the drift) |
    | responsibility resolution | `POST …/responsibility/resolve` — `modules/directory.md` §4a.1 | `POST …/responsibility/simulate` (`design/screens/task.md`) — `simulate` is already the *screen* route, and one name cannot be both |

    `GET /api/v1/directory/persons/me` is emitted with the `persons` spelling because **no
    `people/me` form is written anywhere in the spike**, and renaming it here would be invention
    rather than a ruling (`modules/directory.md` §4a.1). It is a defect, not a second resource.

    ## RBAC strings

    Every operation names the permission it requires, in the `<resource>:<action> : <scope>` form
    (`ARCHITECTURE.md` §11), taken from the RBAC column of its module's `§5a.1`/`§4a.1` table. The
    source documents use **two grammars** — `modules/automation.md` writes
    `automation:event:read : domain:<d>` while `modules/audit.md` writes
    `audit:entry:read:module:<name>` — and `modules/audit.md` §5a.4 records that split rather than
    picking, *"because the enforcer will have to be told which one it is parsing."* The spaced form
    is used throughout below; the unspaced occurrences are noted where they are the only spelling.

    Both guards of §11 apply to every operator path: the route-prefix guard
    (`module:<name>:access`) runs first, then the resource permission. A module-guard rejection and
    a resource-guard rejection are **different outcomes the UI renders differently**
    (`design/app-shell.md` §7.1, DD-05) and both are `403` here.

    ## Retention and horizon

    `ARCHITECTURE.md` §7.8 and `design/screens/automation.md` §3 put the ingest history retention at
    **6 months**. `design/screens/integration.md` §8 calls `invocations` retention *"short"* and
    never quantifies it — its own open question. `reporting` declares `P7Y`.

servers:
  - url: /
    description: |
      No host, port or base URL is stated for the HTTP API anywhere in the spike.
      `ARCHITECTURE.md` §14 covers layout and ports for the *process*, not a public origin.
      The `/api/v1/<module>` prefix is the only routing fact (`design/app-shell.md` §8).

tags:
  - name: automation
    description: |
      Ingest, matching, dispatch. The only stream reader (ADR-03) and the owner of both ingress
      doors (§7.1). `modules/automation.md` · `design/screens/automation.md`.
  - name: process
    description: |
      Stateful, resumable, multi-step cases. `modules/process.md` · `design/screens/process.md`.
  - name: task
    description: |
      Owned, SLA'd human work. `modules/task.md` · `design/screens/task.md`.
  - name: directory
    description: |
      People, teams, calendars, and the single answer to *who is responsible*. A projection of the
      IdP — read-only for the projected columns. `modules/directory.md` · `design/screens/directory.md`.
  - name: notification
    description: |
      Category, severity, channel policy, deliveries. One driver behind a capability.
      `modules/notification.md` · `design/screens/notification.md`.
  - name: integration
    description: |
      The only outbound door (ADR-05). Holds every provider credential and the SSRF guard.
      `modules/integration.md` · `design/screens/integration.md`.
  - name: reporting
    description: |
      Facts, report definitions, runs, regulatory submissions. `modules/reporting.md` ·
      `design/screens/reporting.md`.
  - name: audit
    description: |
      Read-only compliance store. **There is no HTTP write for an audit entry, and that absence is a
      specification** (`modules/audit.md` §5a) — entries are written by the `AuditRecorder`
      capability inside the caller's transaction (ADR-07). The writes that do exist are the
      exceptions and each is itself audited: `export`, legal-hold **place** and **release**, and the
      three `erasure-requests` operations. 13 operations, up from 8 on 2026-07-28.
      `modules/audit.md` §5a · `design/screens/audit.md`.
  - name: platform
    description: |
      **Not a module, and owned by none of the eight.** `ARCHITECTURE.md` §4 names eight modules;
      these five paths belong to the `platform` schema (§13.5) and the capability report (§6), and
      are tagged separately rather than filed under a module that does not own them.
      `modules/audit.md` §5a.1 and `modules/notification.md` §5a.1 each record the ones rendering on
      their screens as **adjacent but not owned** — *"listed here only so their absence from the
      table is not read as an omission."*

      ⚠️ **`design/open-questions.md` G-06 is open on exactly this.** §11 derives
      `module:<name>:access` from the route prefix and there is no `platform` module to derive to.
      Either these routes belong to `audit`, or `platform` needs a guard rule of its own.

security:
  - operatorBearer: []

components:

  securitySchemes:

    operatorBearer:
      type: openIdConnect
      openIdConnectUrl: https://example.invalid/.well-known/openid-configuration
      description: |
        **Operator authentication — `ARCHITECTURE.md` §11.1.** Authentication comes from the company
        IdP (Keycloak); `workspace-ops` issues no passwords. The `Authn` capability verifies the
        bearer token **in-process against the IdP's JWKS** — no authorization or identity service is
        called on the request path.

        The identity mapping reads the **`email` claim**, not `sub`: `sub` is an opaque IdP
        identifier while every audit column in this estate stores email and
        `directory.persons.external_ref` is the email. **A token whose email claim is absent or
        unverified is rejected** — never defaulted to `sub`, which would silently create a second
        identity for one person.

        Authorization is separate and local: two sequential guards (§11), with the policy authored
        in `auth-service` and loaded here as a snapshot (§11.2, ADR-32). Revocation is eventually
        consistent, bounded by §21 · B1's < 5 s p99.

        The `openIdConnectUrl` above is a placeholder — **no discovery URL, realm or issuer is
        stated anywhere in this spike.**

    publisherApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        **Publisher authentication for the HTTP ingress door only — `ARCHITECTURE.md` §7.1.**
        This is *not* the operator bearer. §7.1's table is explicit: the HTTP door is used by
        *"systems that cannot reach Redis, or that need a synchronous answer"* and is authenticated
        with an **API key per publisher, scoped to a set of event-type domains**
        (`publishers.allowed_domains`). The other door — `XADD <domain>:events` — has **no auth at
        all**: network position is the boundary.

        A key is minted by `POST /api/v1/automation/publishers`, **returned exactly once at
        creation and never readable afterwards** — only `api_key_hash` is stored
        (`design/screens/automation.md` §8).

        Failure semantics, `ARCHITECTURE.md` §15: a wrong key is `401`, an out-of-scope domain is
        `403`, and in **both cases the payload is not stored** — recorded as a metric, not a row.
        *"An unauthenticated body is not evidence"* (`modules/automation.md` §9 rule 5).

        ⚠️ **The header name `X-Api-Key` is the one piece of this scheme with no source at all**, and
        `modules/automation.md` §5a.4 says so in the same words: *"the header name is settled nowhere
        in this spike; `contracts/openapi.yaml` carries `X-Api-Key` as an acknowledged
        placeholder."* No document names the header, the parameter, or the scheme (`Bearer`,
        `Basic`, query string). It must be settled before a publisher builds against it — the same
        class of contract gap §7.1 closed for the stream door when it pinned the field name
        `envelope`.

  schemas:

    EventEnvelope:
      # ---- INLINED BY sync-contracts.py — DO NOT EDIT ----
      # Source of truth: contracts/event-envelope.schema.json.
      # Mintlify rejects external $refs and answers 404 on EVERY route when it
      # finds one, so the ref is resolved in this derived copy only.
      title: "workspace-ops event envelope"
      type: "object"
      required:
        - "eventId"
        - "eventType"
        - "specVersion"
        - "occurredAt"
        - "source"
        - "subject"
        - "correlationId"
      additionalProperties: false
      properties:
        eventId:
          type: "string"
          format: "uuid"
          description: "REQUIRED ON BOTH DOORS (§7.1). Identifies the OCCURRENCE, never the resource: approve → reject → approve on one record is three events with one resource id. The audited estate had 0 of 139 sends carrying one, so no consumer could tell a redelivery from a real second event. Idempotency keys on automation.event_keys, not on ingested_events (§7.4)."
          $comment: "A publisher must pick ONE naming taxonomy before minting this. event-catalog/index.md §5: eleven call sites in the measured service insert two rows per fact under two type values, so a dual-taxonomy publisher mints two ids for one occurrence and every §7.4 guard passes."
        eventType:
          type: "string"
          pattern: "^[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*$"
          description: "<domain>.<entity>.<past-tense-verb>. Past tense is enforcement, not decoration: `customer.account.created` is a fact, `customer.account.notify_compliance` is an instruction — and an instruction in an envelope means the publisher decided something that belongs to workspace-ops. The core ships ZERO business domains; it ships five platform ones (task, process, integration, reporting, directory) because the return path re-enters through the same ingest."
          $comment: "The pattern cannot check tense. A reviewer must; §7.2 gives the test."
        specVersion:
          type: "string"
          const: "1.0"
          description: "The envelope version, not the publisher's."
        occurredAt:
          type: "string"
          format: "date-time"
          description: "REQUIRED. When the thing HAPPENED, not when it was received. Arrival time is the time the pipeline was healthy; under backlog the two diverge by exactly the interval where ordering matters. Several audited sends computed the real instant one line above and dropped it."
          $comment: "RFC 3339 with an explicit offset. A local timestamp with no zone is a defect an exchange operating across zones cannot absorb (§13.10)."
        source:
          type: "string"
          minLength: 1
          description: "The publishing system, e.g. `core-api`. Free text, not validated against a table."
        subject:
          type: "object"
          required:
            - "type"
            - "ref"
          additionalProperties: false
          description: "STRUCTURED, always both halves (ADR-29). Routing, the §7.4 cycle guard and the audit trail all key on the pair; buried in `data` it cannot be indexed and the cycle guard silently degrades to type-only."
          properties:
            type:
              type: "string"
              description: "Must be a registered automation.subject_types.code, or the envelope is `invalid`."
            ref:
              type: "string"
              minLength: 1
              description: "OPAQUE (§7.3). Never resolved against a local table — there is no customer table and no transaction table. Only its SHAPE is checked, against subject_types.ref_format."
        actor:
          type:
            - "object"
            - "null"
          required:
            - "type"
            - "ref"
          additionalProperties: false
          description: "Present when a HUMAN acted; null when the system did. Every audited rejection notice omitted both the rejecting reviewer and the reason, though both were persisted one line earlier."
          properties:
            type:
              type: "string"
              enum:
                - "user"
                - "system"
                - "publisher"
                - "process"
            ref:
              type: "string"
              minLength: 1
            display:
              type: "string"
        correlationId:
          type: "string"
          format: "uuid"
          description: "Ties one operator click, the event it produced, and every downstream effect into one thread (§12)."
        causationId:
          type:
            - "string"
            - "null"
          format: "uuid"
          description: "The immediate cause. Null only at the root of a thread."
        depth:
          type: "integer"
          minimum: 0
          default: 0
          description: "The loop guard (§7.4). Read at ingest and at emission, nowhere else. The guard keys on (eventType, subject.type, subject.ref) — not on the event type alone."
        data:
          type: "object"
          description: "FACTS, not references. `{type, id}` requires the consumer to hold the producer's database credential and re-read a row that may have changed — a coupling that outlives every refactor. Two independent codebases in the audit converged on exactly that."
          $comment: "MONEY IS A STRING (§13.9, ADR-31). JSON numbers are IEEE-754 doubles and the domain's amounts are decimal(65,8); this is the rule that fails silently. event-catalog/index.md §4 records four production gates where a float already decides whether an event fires at all — re-reading the column as a decimal string fixes the payload and NOT the gate."
        severity:
          not: {}
          description: "FORBIDDEN (§7.2) — a decision, not a fact. Severity is channel_policies' to decide, per category. Rejected as `invalid`, never silently ignored."
        recipients:
          not: {}
          description: "FORBIDDEN (§7.2) — who is told is directory's answer, resolved from responsibility rules at dispatch. A publisher naming recipients has put routing policy back in its own codebase, which is the condition this platform exists to end."
        channel:
          not: {}
          description: "FORBIDDEN (§7.2) — channel_policies decides, by category × severity."
        template:
          not: {}
          description: "FORBIDDEN (§7.2) — templates live in the notifier driver and are not edited in this product, in either direction."
        actions:
          not: {}
          description: "FORBIDDEN (§7.2) — the workflow decides what happens. An envelope carrying actions is an instruction."
        assignee:
          not: {}
          description: "FORBIDDEN (§7.2) — task assignment is resolved, not asserted."
        priority:
          not: {}
          description: "FORBIDDEN (§7.2) — a decision. Note workflow priority is an integer owned by configuration, and task priority is an enum owned by the task type; neither is the publisher's."
      $comment: "The seven forbidden fields are declared with `not: {}` rather than left to additionalProperties so a validator names the offending field. §20·18 records that ingested_events had no column for the rejection reason and now carries `rejection jsonb {code, field, detail}` — a publisher moving off hand-rolled sends fails FIRST on these seven, and telling them which one is the whole migration aid."
      description: |
        `ARCHITECTURE.md` §7.2. **Authored separately as `contracts/event-envelope.schema.json` and
        authoritative there** — deliberately not restated inline, because two representations of one
        contract is the defect §7.1 forbids arriving through the back door.

        Both doors carry this identical shape: the stream door as
        `XADD <domain>:events MAXLEN ~ <n> * envelope '<the §7.2 JSON, verbatim>'`, one field named
        `envelope`, never flattened.

    Error:
      type: object
      description: |
        ⚠️ **NOT HARVESTED.** No document in this spike specifies an error envelope, an error-code
        vocabulary, or a `problem+json` adoption. This shape exists because a shared error response
        is required of this contract; **the field names below are a placeholder awaiting a decision,
        not a finding.** Do not cite them as designed.

        What *is* specified and must survive whatever shape replaces this:

        - `design/app-shell.md` §7.1 (DD-05) needs a **module-guard denial to be distinguishable
          from a resource-guard denial and from an empty list**, and needs the required permission
          string in the payload so the screen can print
          *"Ask an administrator for `module:integration:access`"*.
        - `design/patterns.md` §2 rule 5 needs save-time rejections to carry **structured detail** —
          *"the editor shows which workflow already holds it"*, *"with the path named"*.
        - `modules/automation.md` §9 rule 20 forbids the ingress door from returning matched
          workflows or actions in **any** response, error included.
      properties:
        code:
          type: string
          description: Placeholder. A stable, machine-readable error identifier.
        message:
          type: string
          description: Placeholder. Human-readable, English (the product's whole vocabulary is English).
        requiredPermission:
          type: string
          description: |
            Placeholder for the one field DD-05 actually requires — the
            `<resource>:<action> : <scope>` or `module:<name>:access` string the caller is missing.
            Present on `403` only.
        details:
          description: Placeholder for the structured detail `design/patterns.md` §2 rule 5 requires.
      required: [code, message]

  responses:

    BadRequest:
      description: |
        Rejected before anything was written. On configuration saves this is the save-time
        validation `design/patterns.md` §2 rule 5 enumerates — a `UNIQUE (event_type_id, priority)`
        collision, two responsibility rules at one priority, a workflow that would `emit` its own
        trigger event type, a `form_schema` using an unsupported type — each of which the backend
        rejects and the editor mirrors at the same moment.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: |
        No valid credential. For an operator path this is a missing, expired, or email-claimless
        bearer token (§11.1). For the ingress door it is an unknown or revoked publisher key, and
        **the payload is not stored** (§15).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: |
        Authenticated, not permitted. **Two distinct causes that the UI renders differently and this
        response must let it tell apart** (`design/app-shell.md` §7.1, DD-05): the route-prefix
        module guard rejected (`module:<name>:access` — the whole screen is replaced), or the
        resource permission rejected (rendered in place). Neither is an empty list, which is a
        third, non-error outcome.

        On the ingress door, `403` means the publisher's key is valid but the event type's domain is
        outside `publishers.allowed_domains`. The payload is not stored.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: |
        The addressed resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ServerError:
      description: |
        Includes the deliberate case in `ARCHITECTURE.md` §12: **an audit write failure rolls back
        the business change and surfaces as a `5xx`, never as a silent skip.**
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  parameters:

    CorrelationIdPath:
      name: correlationId
      in: path
      required: true
      schema:
        type: string
      description: |
        The identifier that ties one case together across every module. `modules/audit.md` §5 calls
        `timeline(correlationId)` *"the most valuable query in the platform"*. Distinct from
        `traceId`, which joins the distributed trace — *"two identifiers, two questions"*
        (`design/screens/audit.md` §1).

paths:

  # ───────────────────────────────────────────────────────────────────────────
  # automation
  # ───────────────────────────────────────────────────────────────────────────

  /api/v1/automation/events/{eventTypeCode}:
    post:
      tags: [automation]
      operationId: ingestEvent
      summary: HTTP ingress door — publish one event envelope
      description: |
        **Owned by `modules/automation.md` §5a.1** — the section this contract is generated from.

        **`ARCHITECTURE.md` §7.1 — one of only two paths in this file named above `design/`.**
        The second of two doors; the first is `XADD <domain>:events`. Both feed the **identical**
        matcher and produce the identical `ingested_events` row — *"a behaviour that exists on only
        one transport is a defect, not a feature."*

        **This endpoint exists because an event type is registered, not because code was written**
        (§7.1, §9). Registering an event type with `http_ingress` set makes the path exist
        immediately, with no deploy.

        **RBAC: none.** This path is outside §11 entirely — it is authenticated by a **publisher API
        key** scoped to a set of event-type domains, not by an operator bearer token, and no
        `module:automation:access` guard applies. It is the one path in this file with a different
        security scheme.

        **Backpressure** (`modules/automation.md` §7.11, §7.12): a token bucket keyed on
        `publisher_id` and a rolling-window quota, both columns on the `publishers` row because
        *"one publisher's normal volume is another's incident"*. `RateLimit-*` response headers are
        returned so a well-behaved caller backs off unprompted. Above the consumer-group lag
        threshold **this door sheds load with `503` + `Retry-After`; the stream door is never shed.**
      security:
        - publisherApiKey: []
      parameters:
        - name: eventTypeCode
          in: path
          required: true
          schema:
            type: string
          description: |
            The registered event type, `<domain>.<entity>.<past-tense-verb>` (§7.2), e.g.
            `customer.account.created`. Past tense is enforcement, not decoration:
            `customer.account.notify_compliance` is an instruction, and an instruction in an
            envelope means the publisher decided something that belongs to `workspace-ops`.
      requestBody:
        required: true
        description: |
          The §7.2 envelope, verbatim. `eventId` is **required on both doors** — optional would mean
          every timeout retry becomes a duplicate notification nobody notices.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventEnvelope'
      responses:
        '202':
          description: |
            **Intent recorded — not "anything happened".** Actions execute in the pump afterwards,
            so there is no synchronous outcome to report.

            **The response body is `{eventId, status}` and nothing more** (`modules/automation.md`
            §7.11, §9 rule 20). An earlier draft also returned the matched workflows and their
            actions; that hands an authenticated publisher the configuration to no operational
            benefit. `status` is the §7.3 ingest status — including **`unmapped`**, which is
            emphatically **not** a `404`: the event type *is* registered and the envelope *was*
            stored; no workflow matched it yet. See the `404` below.
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId:
                    type: string
                  status:
                    type: string
                    description: |
                      `modules/automation.md` §7.3. `observed` and `unmapped` both produced no
                      action, but one was a decision and the other is an omission — only the second
                      is work.
                    enum:
                      - invalid
                      - observed
                      - suppressed
                      - unmapped
                      - depth_exceeded
                      - cycle_detected
                      - planned
                      - dispatched
                      - partial
                      - dead
                required: [eventId, status]
        '400':
          description: |
            `invalid` — the envelope failed validation, `subject.type` is not declared on the
            registered event type, or `data` exceeded the size ceiling. Oversized is **`invalid`,
            never truncated**: a truncated envelope is a fact quietly altered.

            The seven forbidden envelope fields — `severity` · `recipients` · `channel` ·
            `template` · `actions` · `assignee` · `priority` — are **rejected as `invalid`, not
            silently ignored** (§7.2). Each is a decision, not a fact.

            ⚠️ Whether an `invalid` outcome is returned as `400` or as a `202` carrying
            `status: invalid` is **not stated in any document**; both readings are available from
            §7.1 and §7.3. Emitted here as `400` for the pre-storage validation failures and left
            as a recorded ambiguity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            Unknown or revoked publisher key. **Payload not stored** — recorded as a metric, not a
            row (§15). `design/screens/automation.md` §8 surfaces this as a counted queue:
            `401 unknown or revoked key   142  last 7d`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            The key is valid but the event type's domain is outside the publisher's
            `allowed_domains`. **Payload not stored.** Surfaced as
            `403 domain out of scope       17  last 7d`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            **The event type is not registered.** §7.1 is explicit that this is *"deliberately
            different from `unmapped`"*:

            | | Registered? | Envelope stored? | Meaning |
            |---|---|---|---|
            | `404` | **No** | **No** | This endpoint does not exist, because no event type by this code was ever registered. Nothing to store, nothing to fix in a workflow. The fix is a registration. |
            | `unmapped` (in a `202`) | **Yes** | **Yes** | The type is registered and the fact was accepted; **no workflow matched it at all**. A work queue — *"build a workflow from this event"* (§15). |

            Conflating them turns *"nobody has configured a reaction yet"* into *"your integration
            is broken"*, and vice versa. Also returned when the event type exists but has
            `http_ingress` disabled (`design/screens/automation.md` §3) — the stream door still
            accepts it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `duplicate`. The `INSERT` into `automation.event_keys` inside the ingest transaction
            conflicted — **the conflict *is* the duplicate branch** (§7.4). Expected traffic under
            at-least-once delivery, not an error condition to alert on.

            Idempotency deliberately does **not** live on `ingested_events`: that table is
            partitioned by month, and PostgreSQL requires a unique index on a partitioned table to
            include every partition-key column, so `UNIQUE (event_id)` is not creatable there at all
            (ADR-15).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |
            Rate limit or rolling-window quota exceeded (`modules/automation.md` §7.11). **Recorded,
            not silent** — *"a limit that is silently hit is a limit discovered during an outage"* —
            and surfaced as a queue on `/automation/publishers`. `RateLimit-*` headers accompany
            every response on this path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            Backpressure. Above the consumer-group lag threshold **the HTTP door sheds load** with
            `Retry-After` (`modules/automation.md` §7.12). The stream door is never shed —
            *"a consumer that refuses to read is how a durable queue becomes a lost one"*.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/automation/events:
    get:
      tags: [automation]
      operationId: findIngestedEvents
      summary: Ingest history
      description: |
        **Owned by `modules/automation.md` §5a.1** — the section this contract is generated from.

        `design/screens/automation.md` §1 · `modules/automation.md` §5
        (`AutomationClient.findIngestedEvents`). Backs `/automation/events`.

        **RBAC: `automation:event:read : domain:<d>`** — scope is the event-type domain. Note
        `design/screens/automation.md` §0 flags this scope vocabulary as *proposed by the design,
        not inherited*: the module document declares none, which §11 requires per resource type.

        **Defaults (DD-automation-01): `last 24h`, every status, `received_at` desc.** Explicitly
        *not* `status: unmapped` — that is a saved view, not the default. Seeded saved views:
        `Unmapped` · `Needs attention` · `Configuration defects`.

        **Page size 50** (`1–50 of 1,284`). **Live**, not polled: new rows fade in at the top and an
        open row is never removed or reordered.

        Columns behind the response: `ingested_events.*` plus `publishers.code` via `.publisher_id`.
      parameters:
        - name: facets
          in: query
          schema:
            type: string
            enum: [status]
          description: |
            `?facets=status` drives the scope-summary counts — `count(*) GROUP BY
            ingested_events.status`, rendered as `1,284 in the last 24h · 12 unmapped · 3 partial`,
            three independently clickable spans (`design/app-shell.md` §5).
        - name: correlationId
          in: query
          schema:
            type: string
          description: |
            Named only in `design/screens/audit.md` §2, which composes the `INGEST` half of a trace
            from this endpoint rather than giving `audit.timeline()` a cross-schema read.
            `design/screens/automation.md`'s own Data table never lists it.
        - name: status
          in: query
          schema:
            type: string
          description: |
            Filter chip. §7.3 vocabulary. ⚠️ Whether this is repeatable is not stated for this
            endpoint (`notification`'s equivalent is explicitly multi-valued).
        - name: eventType
          in: query
          schema:
            type: string
          description: Filter chip named in §1; no wire encoding is stated.
        - name: subject
          in: query
          schema:
            type: string
          description: Filter chip named in §1; no wire encoding is stated.
        - name: source
          in: query
          schema:
            type: string
          description: Filter chip named in §1; no wire encoding is stated.
        - name: publisher
          in: query
          schema:
            type: string
          description: Filter chip named in §1; no wire encoding is stated.
      responses:
        '200':
          description: |
            `Page<IngestedEventDto>`. ⚠️ Neither the page wrapper nor the DTO is described as a wire
            shape anywhere; only the backing columns are named.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/automation/events/count:
    get:
      tags: [automation]
      operationId: countIngestedEvents
      summary: Envelope count in a range, and the retention floor
      description: |
        **Owned by `modules/automation.md` §5a.1** — the section this contract is generated from.

        `modules/automation.md` §5a.1 — which is what changed on 2026-07-28. This path was
        previously named **only** in `design/screens/reporting.md` §2, whose backfill dialog uses it
        to state *"envelopes in range, horizon"* before a replay, sourced from
        `automation.ingested_events count and retention floor`.

        **RBAC: not stated**, and the module table says so in those words.
        `automation:event:read : domain:<d>` is the plausible neighbour and is not asserted here.

        **It survives having no endpoint of its own to serve** (`modules/automation.md` §5a.3):
        backfill itself is pathless and unpersisted, but the alternative to this endpoint is
        `reporting` querying `automation.ingested_events` directly — *"the cross-schema read
        `reporting.md` §4 exists to forbid. The count and the six-month retention floor are this
        module's facts; one query here is cheaper than a boundary violation there."*

        ⚠️ Parameters are unspecified. The calling dialog shows a `Range` (`2026-01-01 → 2026-06-30`)
        so a range must be passed, but neither parameter is named.

        **Adopted — this operation has no client method** (`modules/automation.md` §5a.3). `AutomationClient`
        must gain:

        ```ts
        abstract countIngestedEvents(range: { from: Date; to: Date }): Promise<IngestCount>;
        ```
      responses:
        '200':
          description: |
            ⚠️ **Response shape UNSPECIFIED.** The screen renders a count and a retention horizon;
            no field names are given.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/automation/events/{id}:
    get:
      tags: [automation]
      operationId: getIngestedEvent
      summary: Event detail — envelope, matched workflows, per-action execution
      description: |
        **Owned by `modules/automation.md` §5a.1** — the section this contract is generated from.

        `design/screens/automation.md` §2. **RBAC: `automation:event:read : domain:<d>`.**

        **Live while `status = planned`, static after.** `partial` and `dead` never transition on
        their own (§7.3b), *"so polling them promises something the backend does not do"*.

        Fields behind the response: `ingested_events.event_id`, `.status`, `.subject_type`,
        `.subject_ref`, `.source`, `.depth`, `.causation_id`, `.correlation_id`, `.trace_id`,
        `.received_at`, `.envelope`.

        **Adopted — this operation has no client method** (`modules/automation.md` §5a.3). `AutomationClient`
        must gain:

        ```ts
        abstract getIngestedEvent(id: string, opts?: { includeOutbox?: boolean }): Promise<IngestedEventDto | null>;
        ```

        It reaches into the partitioned ingest history rather than a configuration table, which is the line
        §5a.3 draws between the nine adopts and the nine registry reads that stay in `internal/http/`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: include
          in: query
          schema:
            type: string
            enum: [outbox]
          description: |
            `?include=outbox` adds the hand-off state per action — `automation.outbox.target`,
            `.operation`, `.attempt_count`, `.sent_at`, `.dead_at`, `.last_error`.
            *"`(target, operation)` is the whole dispatch address"* (ADR-25).
      responses:
        '200':
          description: |
            ⚠️ **Response shape UNSPECIFIED** beyond the column list above.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/automation/events/{id}/replay:
    post:
      tags: [automation]
      operationId: replayIngestedEvent
      summary: Re-execute the not-yet-succeeded actions of one stored envelope
      description: |
        **Owned by `modules/automation.md` §5a.1** — the section this contract is generated from.

        `design/screens/automation.md` §2 · `modules/automation.md` §5
        (`AutomationClient.replay(ingestedEventId, actor)`) and §7.3b.

        **RBAC: `automation:event:replay : domain:<d>`.**

        **Effects are re-executed, not simulated.** Replay re-runs **only** the actions that are not
        `succeeded`; the successful ones keep their `idempotency_key` and are skipped, so a replay
        never re-sends a notification that already went out. **Nothing is undone** — there is no
        rollback and no compensation (ADR-11), and `design/patterns.md` §6 requires the confirmation
        to say so and to name the idempotency keys involved.

        **Bulk replay does not exist** (`modules/automation.md` §7.3b) — *"building it needs a
        deliberate decision about blast radius rather than a convenience method."* Do not add a
        collection form of this operation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        description: |
          ⚠️ **Request body UNSPECIFIED.** The client signature is `replay(ingestedEventId, actor)`,
          so an actor is involved, but no field name, type or transport (body vs. the bearer token's
          identity) is stated anywhere. §11.1 makes the operator's identity available from the token,
          which would make a body unnecessary — but no document says so.
        content:
          application/json:
            schema: {}
      responses:
        '200':
          description: |
            `ReplayResult`. ⚠️ **Shape UNSPECIFIED.** The screen needs at minimum what was skipped
            and why, but no fields are named.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/automation/event-types:
    get:
      tags: [automation]
      operationId: findEventTypes
      summary: Event type registry
      description: |
        **Owned by `modules/automation.md` §5a.1** — the section this contract is generated from.

        `design/screens/automation.md` §3. Registering a row here is what **makes an HTTP ingress
        endpoint exist** (§9, §7.1).

        **RBAC: `automation:event_type:write : domain:<d>`** is the screen's declared primary;
        a read-only permission for this list is not separately named.

        **Filters:** `active` · `domain` · `http ingress` · `has no workflow`.
        **Default: `active`, `code` asc. Static**, reloading on save.

        Columns: `event_types.code`, `.domain`, `.subject_type_codes`, `.data_schema`,
        `.declared_retention` (ISO-8601, e.g. `P7Y`), `.http_ingress`, `.sample_envelope`,
        `.active`.

        **The observe-only refusal is a real behaviour of this screen**, not a warning: a type
        declaring 7-year retention cannot be satisfied by `observe` alone, because the ingest
        history is **dropped after 6 months** (`ARCHITECTURE.md` §7.8). The screen offers a `record`
        action bound to a record type whose retention is long enough, reading
        `GET /api/v1/automation/record-types` for the alternatives.

        **No client method, and it must not get one — configuration** (`modules/automation.md` §5a.2).
        The registry reads are served by `internal/http/` over `internal/repositories/`: *"nothing outside
        this module reads the matcher's own configuration, and putting it on the exported token would let any
        module that injects `AutomationClient` read — and, the first time somebody is in a hurry, write — the
        rules that decide what happens to every event in the platform."*
      parameters:
        - name: window
          in: query
          schema:
            type: string
            default: 24h
          description: |
            `?window=24h` — the 24h volume column and the publishers in scope.
            `design/screens/automation.md` §6 is explicit that the consequence preview must use
            **the same query and the same window as this column, not a second number.**
        - name: active
          in: query
          schema:
            type: boolean
            default: true
          description: 'Default: `active`.'
        - name: domain
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ⚠️ **Response shape UNSPECIFIED** beyond the column list above.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/automation/event-types/{code}:
    get:
      tags: [automation]
