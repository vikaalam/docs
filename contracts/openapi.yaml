      description: |
        **Owned by `modules/reporting.md` §5a.1** — the section this contract is generated from.

        `design/screens/reporting.md` §1. **RBAC: `reporting:definition:read : domain:<d>`** —
        scope throughout this module is the definition's `domain`.

        **Filters:** `domain:` · `active` · `has destination` · `has unpublished draft`.
        **Default: `active`** — *"an inactive definition is a decision someone already made."*
        **Static** — *"definitions change a few times a quarter."*

        Columns: `report_definitions.{code,name,domain,active}`.

        **No client method — configuration** (`modules/reporting.md` §5a.2). Served by `internal/http/` over
        this module's own tables: *"nothing outside `reporting` reads a definition — `RunReportCommand`
        carries a `definitionCode` and this module resolves it to the latest published version itself."*
      responses:
